# XcodeGen spec — the .xcodeproj is generated on the CI runner
# (`xcodegen generate`), never committed and never built locally (see docs/ios.md).
name: MedTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Overridden on the xcodebuild command line from repo variables.
    PRODUCT_BUNDLE_IDENTIFIER: com.example.medtracker
    # CLOUD_BASE_DOMAIN (accounts are <sub>.<this>); empty in the unsigned CI build.
    WG_BASE_DOMAIN: ""
targets:
  MedTracker:
    type: application
    platform: iOS
    sources:
      - App
      # Local-mode diagnostic page (bd med-o7zq.1), copied as a folder to
      # <bundle>/LocalSpike and served by ios/App/LocalSpike.swift.
      - path: LocalSpike
        type: folder
      # Local mode (bd med-o7zq.4): the web app, copied from web/ by
      # bundle-web.sh before `xcodegen generate`, served by App/LocalApp.swift.
      - path: LocalApp
        type: folder
    # Visual QA (bd med-y5xx.2): `xcodebuild test -only-testing:MedTrackerUITests`.
    # The archive action stays the app alone, in Release, so the Debug-only
    # QA hook (Shell.swift `-wgQAScene`) never ships.
    scheme:
      testTargets:
        - MedTrackerUITests
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sun, so no control falls back to system blue (bd med-ckm5.13, App/Wg.swift).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        # The privacy-URL script below edits the built bundle, outside declared outputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # No real domain in the repo (bd med-ffuu.3): the Privacy footer gets its URL
    # at build time; with WG_BASE_DOMAIN empty it keeps the source plist's text.
    postBuildScripts:
      - name: Privacy policy URL in Settings.bundle
        basedOnDependencyAnalysis: false
        script: |
          [ -n "$WG_BASE_DOMAIN" ] || exit 0
          p="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Settings.bundle/Root.plist"
          pb=/usr/libexec/PlistBuddy
          i=0
          while "$pb" -c "Print :PreferenceSpecifiers:$i" "$p" >/dev/null 2>&1; do
            if [ "$("$pb" -c "Print :PreferenceSpecifiers:$i:Title" "$p" 2>/dev/null)" = Privacy ]; then
              want="Privacy policy: https://$WG_BASE_DOMAIN/privacy. In the app: Settings → Account & privacy."
              "$pb" -c "Set :PreferenceSpecifiers:$i:FooterText \"$want\"" "$p" || exit 1
              # Fail the build unless the footer reads exactly that (no stray quotes).
              [ "$("$pb" -c "Print :PreferenceSpecifiers:$i:FooterText" "$p")" = "$want" ] && exit 0
              echo "error: Privacy FooterText not set in $p"
              exit 1
            fi
            i=$((i+1))
          done
          echo "error: no Privacy group in $p"
          exit 1
    # Passkeys in WKWebView for every account subdomain; confirmed by the
    # server's /.well-known/apple-app-site-association (bd med-w6gx.1).
    entitlements:
      path: App/MedTracker.entitlements
      properties:
        com.apple.developer.associated-domains:
          - "webcredentials:*.$(WG_BASE_DOMAIN)"
          # Invite landing https://<base>/i/<sub>#<token> opens the app (bd
          # med-ta2n.11; the AASA applinks component /i/* is server-side). The
          # base only: account subdomains never become universal links.
          - "applinks:$(WG_BASE_DOMAIN)"
        # Apple Health, read-only (bd med-w6gx.6, ios/App/Health.swift).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # App Attest for local mode's anonymous trial AI (bd med-o7zq.16,
        # App/Attest.swift); the App ID has the capability and the App Store
        # profile carries it.
        com.apple.developer.devicecheck.appattest-environment: production
        # No aps-environment here (native push, bd med-erq1.4): the archive step
        # in ios.yml adds it only when the App Store profile carries Push (owner
        # bead med-erq1.7), so a profile without it still signs.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Med Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # --wg-bg-screen (Assets.xcassets): no white flash before the dark app.
        # N6 (bd med-ckm5.15): the 96 pt mark, centred; RootView fades it out
        # over the first page (App.swift LaunchMark).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        # The kit's type (bd med-ckm5.13, App/Wg.swift): OFL, licences beside them in App/Fonts.
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - JetBrainsMono-Medium.ttf
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only is legal for iPad only with full screen (App Store 90474).
        UIRequiresFullScreen: true
        # Native push's content-available wake (bd med-erq1.4, App.swift QuickAction).
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        # Home Screen quick action (bd med-w6gx.24, App.swift QuickAction).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: copy-diagnostics
            UIApplicationShortcutItemTitle: Copy diagnostics
            UIApplicationShortcutItemIconSymbolName: doc.on.clipboard
        # medtracker://i/<sub>#<token> (bd med-ta2n.11): the landing page's
        # "Open in the app" — Safari will not open a universal link to the host it is on.
        CFBundleURLTypes:
          - CFBundleURLName: invite
            CFBundleURLSchemes: [medtracker]
        # Invites open only accounts at <sub>.<this> (Shell.swift, AccountURL.swift).
        WGBaseDomain: $(WG_BASE_DOMAIN)
        # The app's screens are dark (--wg-bg-screen) in both system appearances.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSCameraUsageDescription: Scan food barcodes, take meal photos and scan your account QR code.
        # Voice calls and voice notes in feedback (getUserMedia audio).
        NSMicrophoneUsageDescription: Talk to the voice assistant and record voice notes in feedback.
        NSHealthShareUsageDescription: Import your blood pressure, weight, sleep, workouts, steps, heart rate and blood oxygen from Apple Health into your encrypted vault.
        # Read-only, but App Store upload validation rejects a HealthKit app
        # without the update string too (seen on the med-w6gx.6 dispatch).
        NSHealthUpdateUsageDescription: Med Tracker only reads from Apple Health and never writes to it.
        # Local mode's optional lock (bd med-o7zq.8, App/LocalLock.swift).
        NSFaceIDUsageDescription: Unlock Med Tracker when you turn on its lock.
        # Service Workers only run on app-bound domains (max 10); the wildcard
        # entry covers every account subdomain (spike med-w6gx.2, check 3).
        # "wgapp:" (trailing colon) is an app-bound SCHEME: local mode's
        # wgapp://local/ (App/LocalOrigin.swift, bd med-o7zq.4) and its
        # diagnostic (App/LocalSpike.swift, bd med-o7zq.10). Without it WebKit
        # refuses the load under the app-bound limit and, with the limit off,
        # drops the page's script message handlers.
        WKAppBoundDomains:
          - "$(WG_BASE_DOMAIN)"
          - "*.$(WG_BASE_DOMAIN)"
          - "wgapp:"
  # Visual QA on the Simulator (bd med-y5xx.2, docs/design/ios-visual-testing.md):
  # one screenshot per scene of tests/visual/scenes.json, with the real keyboard.
  MedTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: MedTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.medtracker.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # The copy below reads outside the target's declared inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # A script, not a resource: the scene list comes from the driver bead and
    # the bundle must still build without it (the test then fails, saying so).
    postBuildScripts:
      - name: Copy tests/visual/scenes.json
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/../tests/visual/scenes.json"
          if [ -f "$src" ]; then
            cp "$src" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/scenes.json"
          else
            echo "warning: tests/visual/scenes.json missing; VisualQATests will fail"
          fi

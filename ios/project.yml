# XcodeGen spec — the .xcodeproj is generated on the CI runner
# (`xcodegen generate`), never committed and never built locally (see docs/ios.md).
name: MedTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Overridden on the xcodebuild command line from repo variables.
    PRODUCT_BUNDLE_IDENTIFIER: com.example.medtracker
    WG_START_URL: ""
    # CLOUD_BASE_DOMAIN (accounts are <sub>.<this>); empty in the unsigned CI build.
    WG_BASE_DOMAIN: ""
targets:
  MedTracker:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    # Passkeys in WKWebView for every account subdomain; confirmed by the
    # server's /.well-known/apple-app-site-association (bd med-w6gx.1).
    entitlements:
      path: App/MedTracker.entitlements
      properties:
        com.apple.developer.associated-domains:
          - "webcredentials:*.$(WG_BASE_DOMAIN)"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Med Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only is legal for iPad only with full screen (App Store 90474).
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        WGStartURL: $(WG_START_URL)
        NSCameraUsageDescription: Scan food barcodes and take meal photos.
        # Service Workers only run on app-bound domains (max 10). Whether the
        # wildcard entry covers arbitrary account subdomains is spike check 3.
        WKAppBoundDomains:
          - "$(WG_BASE_DOMAIN)"
          - "*.$(WG_BASE_DOMAIN)"

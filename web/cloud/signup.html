<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Med Tracker</title>
<!-- Make the origin installable during onboarding, so the signup wizard's
     "Add to Home Screen" step actually works — iOS web push requires an
     installed PWA (med-v1z). Assets are served from the C1 app tree. -->
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Med Tracker">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/css/cloud.css">
</head>
<body>
  <main id="app">
    <!-- Populated by js/signup.js (claim/registration wizard) or
         js/unlock.js (returning-device unlock), chosen at runtime from
         observable state — see docs/cloud-mode.md Onboarding. -->
  </main>
  <script src="/js/app.js" type="module"></script>
</body>
</html>

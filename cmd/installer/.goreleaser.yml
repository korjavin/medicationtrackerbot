version: 2

project_name: medtracker-installer

builds:
  - id: installer
    main: .
    binary: medtracker-installer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/korjavin/medicationtrackerbot/installer/internal/config.DefaultFoodAPIURL={{ .Env.FOOD_API_URL }}
      - -X github.com/korjavin/medicationtrackerbot/installer/internal/config.DefaultFoodAPIKey={{ .Env.FOOD_API_KEY }}

archives:
  - id: installer
    builds:
      - installer
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: korjavin
    name: medicationtrackerbot
  name_template: "Installer {{ .Tag }}"
  draft: false
  prerelease: auto

id: reset-sync-during-download
title: Reset sync while the account download is still running loads the server's current data
platforms: [web]
preconditions:
  - An account with data, on a device whose first account download is slow (weak network)
steps:
  - Open and unlock the app; while the download is still running, tap Reset sync in Settings
  - Let both the old and the new download finish
  - Repeat with an upload in flight instead (save an entry, or import a full vault, on the weak network): reset while it is still sending, and let it finish
  - Repeat with the app open in two tabs: tap Reset sync in one tab while the other is still downloading or sending
  - With the app open in two tabs, import a full vault in one tab while the other is still sending its own full upload; close the importing tab before its upload finishes
invariants:
  - After the reset the app shows the server's current data, not the older copy from the download that began before it
  - Changes made on other devices after that older copy are not skipped later
  - The other tab's upload, which began before the import, does not mark the import as synced; the import still reads as not yet uploaded (deleting the account warns) until its own upload lands
covered_by:
  web: web/cloud/js/tests/sync.test.js#a bootstrap begun before a reset or DB drop lands nothing (med-7jgk)  # another tab's reset, import rejection and import upload: web/cloud/js/tests/sync.test.js#another tab's reset or same-millisecond edit (med-0vdh)
source: [med-7jgk, med-w4nq, med-0vdh, med-yrq1]

id: reminder-fires-offline
title: A due medication reminder fires with the app closed and no network; its tap opens the dose
platforms: [web, android, ios]
preconditions:
  - A medication with a reminder due in a few minutes
  - Notifications enabled
steps:
  - Close the app fully
  - Turn on airplane mode (phone apps)
  - Wait for the reminder
  - Tap the notification
invariants:
  - On the phone apps the reminder is scheduled on the device and fires with no network
  - On the web the reminder arrives by push, so it needs a network at delivery time
  - The tap opens the app on that dose, ready to take, also from a cold start and while locked
covered_by:
  web: manual  # partial: web/cloud/js/tests/sw.reminder-actions.test.js (the tap opens the dose); missing: a real Web Push delivery with the page closed, and the tap from a cold start or a locked screen, need a browser with a push service
  android: manual  # partial: android/qa/scenarios/reminders-offline.mjs (fires with the process killed and before the first unlock, tap opens the dose; network on, no locked tap)
  ios: manual  # no iOS run yet: the local notification posted with the app terminated and the server down, its tap opening the dose, is med-sz4k.6.3; tests/visual/scenes.json#reminder-stale-* (VisualQATests, run by the ios.yml visual job, not qa) tap a notification delivered while the app runs; no cold-start or locked-screen tap
source: [med-nt9p.55]

id: health-import-permissions
title: Health import asks for steps, sleep, SpO2 and heart rate and the rows appear in Vitals
platforms: [web, android, ios]
preconditions:
  - Phone app; Health Connect (Android) or Apple Health (iOS) holds steps, sleep, SpO2 and heart rate
steps:
  - Open Settings and turn on Health import
  - Grant every requested kind in the system sheet
  - Open Vitals
invariants:
  - The system sheet asks for steps, sleep, SpO2 and heart rate
  - After granting, steps, sleep, SpO2 and heart rate rows show in Vitals
  - If access was denied the app says where to allow it
  - In a browser there is no Health row in Settings at all
  - On a phone whose system has no Health store (Health Connect not installed) the toggle flips back with "<Store> is not available on this device."
  - If the authorization request itself fails (e.g. times out) the toggle flips back with "Couldn't reach <Store>. Try again." — never the not-available sentence
covered_by:
  web: web/cloud/js/tests/health-import.test.js#in a browser (no Health capability) mounts no Health row in Settings  # also invariant 6: health-import.test.js#flips back with a retry message when the authorization request throws
  android: manual  # partial: android/qa/scenarios/health-connect.mjs (real SDK-granted steps/sleep/HR/SpO2 import into Vitals; same package, SDK-assigned dataOrigin); real requested-kinds system sheet, full denied guidance and real third-party origin/user Health data remain unasserted
  ios: ios/UITests/FlowQAHealthImportTests.swift#testDeniedHealthGuidance  # invariants 1 and 3 (page's first sheet lists the 11 read kinds, Steps/Sleep/BloodOxygen/HeartRate ⊂; denied → Settings guidance); invariant 2: #testHealthImport (union seed sheet, native import) + tests/visual/scenes.json#health-kit-import renders steps/sleep/HR/SpO2; invariant 6 (throw copy) is web logic, web/cloud/js/tests/health-import.test.js "flips back with a retry message when the authorization request throws" — a real HealthKit throw (code 100, med-wqj8 family 4) cannot be induced on the Simulator; real Health data from real sources remains manual
source: [Zulip 11260, med-iou1]

id: health-import-permissions
title: Health import asks for steps, sleep, SpO2 and heart rate and the rows appear in Vitals
platforms: [web, android, ios]
preconditions:
  - Phone app; Health Connect (Android) or Apple Health (iOS) holds steps, sleep, SpO2 and heart rate
steps:
  - Open Settings and turn on Health import
  - Grant every requested kind in the system sheet
  - Open Vitals
invariants:
  - The system sheet asks for steps, sleep, SpO2 and heart rate
  - After granting, steps, sleep, SpO2 and heart rate rows show in Vitals
  - If access was denied the app says where to allow it
  - Where there is no Health store (the web) the toggle flips back with a message
covered_by:
  web: manual  # n/a on web as written: a browser shows no Health import toggle at all (cloud-boot.js loads health-import.js only where Health is supported; web/cloud/js/tests/health-import.test.js asserts startHealthImport returns null there), so "the toggle flips back" cannot happen; the flip-back copy is pinned for a store that refuses (same file, Settings row)
  android: manual  # partial: android/qa/scenarios/health-connect.mjs (pm-granted SDK import, steps/HR/SpO2 in Vitals); no real permission sheet, sleep fixture/import, full denied message path or real-user Health data
  ios: manual
source: [Zulip 11260]

id: health-write-back
title: Entries made in the app are written to Health, edited in place and removed, never twice
platforms: [web, android, ios]
preconditions:
  - Phone app with Health import on; Health Connect (Android) or Apple Health (iOS)
  - '"Also write my entries" switched on and write access allowed for blood pressure and weight'
steps:
  - Enter a blood pressure reading by hand
  - Open the Health app, then edit the reading in Med Tracker, then delete it
  - Edit a blood pressure reading and a weight that were imported from Health
  - Enter a reading while Health refuses write access, delete it, then allow access again and reopen the app
  - Switch "Also write my entries" off and enter another reading
  - Enter a BP reading with a pulse; edit it to clear the pulse; edit again to set one; deny heart-rate write access and enter another BP
  - Complete a workout session; delete it; start a session and leave it open; skip a scheduled one
  - Log an ad-hoc workout of only a cardio-tagged exercise and complete it; deny workout write access and complete another session
  - Mark a reminded plan workout Done from the notification without starting it; do the same for a plan day with no exercises
  - Turn the switch on with past entries present, some of them already in Health from another app; accept the offer / decline and use Settings → Copy past entries; background the app mid-copy and return; with weight read denied (Android), copy, leave Settings and tap Copy past entries again
  - "On Android without past-data permission, open Copy with an entry older than 30 days; reopen the app and recount; grant past-data access where the phone supports it and recount again"
invariants:
  - "A hand-entered reading shows in the Health app within seconds, as written by Med Tracker"
  - "Editing it changes the same Health record; deleting it removes it"
  - "A reading imported from Health and edited in the app (blood pressure and weight) is unchanged in Health"
  - "With import on, the reading Med Tracker wrote never comes back as a second row"
  - "A delete made while Health refused access is delivered after access returns or on the next open"
  - "Switching it off stops updates and leaves the copies already in Health"
  - "The switch shows only while import is on; refused write access flips it back with where to allow it; one kind allowed keeps it on and names the other"
  - 'Write access revoked later in system settings leaves the switch on, reading "Writing paused: access was removed"; entries made meanwhile reach Health once access returns'
  - "A BP reading with a pulse shows in the Health app as one blood pressure record and one heart-rate entry at the same time, both by Med Tracker"
  - "Clearing the pulse removes the heart-rate entry, setting it again brings it back, deleting the reading removes both"
  - "With heart-rate write access denied, BP and weight still arrive"
  - "Pulses of readings saved or edited after this update arrive once access is allowed; an older reading follows on its next edit"
  - "The heart-rate entries Med Tracker wrote never come back into the Vitals heart-rate card"
  - "A completed workout shows in the Health app as one strength workout from its start to its finish, by Med Tracker, with no exercises or sets"
  - "An ad-hoc workout that is not all strength-tagged exercises shows as an other workout, never as strength"
  - "Deleting the session removes it; an open, pending or skipped session never appears"
  - "Workouts imported from Health are unchanged, and the mirrored workout never comes back as a Health workout in History"
  - "With workout write access denied, BP, pulse and weight still arrive"
  - "a workout logged by message or voice without a start and end is not copied to Health; one logged in the app, with sets, is"
  - "A plan workout marked Done without starting it appears in Health from its scheduled time, 5 minutes per exercise of that day; one with no exercises does not"
  - "Every own past reading/weight/completed workout appears once in Health, with pulse where recorded; a reading another app already put into Health is not copied and not counted; entries imported from Health are not copied; a second copy adds nothing and says everything is already in Health; Copy shows only on a shell that reports how far back it can read, and entries older than that are named, not copied; a copy interrupted by backgrounding or a Health refusal finishes later and reports what was copied and what was not allowed"
  - "A kind whose write Health refused goes out on its own once allowed; a kind whose read Health Connect denied (Android) is not copied, the result asks to allow it and tap Copy past entries again: allowed while Settings is still open, its entries join; leaving Settings frees Copy, and the next tap counts them, never locking Copy while the read stays denied"
  - "On Android without past-data access, a new Copy names and excludes entries older than the last 30 days from today, including when past-data access is not offered; removing all Health permissions and allowing them again does not make those older entries eligible"
covered_by:
  web: web/cloud/js/tests/health-import.test.js  # ledger and executor over the real write path, the Settings write row (HW0-HW5), the derived hr kind, the workout kind, the supported fallback and copy past entries (HW6-HW9b)
  android: manual  # android/qa/scenarios/health-connect.mjs covers BP/weight/pulse/workout SDK create/update/delete, no echo, partial/late grants, real mixed entries batch replies/store results/replay, empty/write-only rolling bounds and Copy cutoff; HealthConnectTest covers 50 mixed entries in one insertion, malformed/whole-call failures and the history-granted zero branch; real permission sheets and remaining plan/notification cases remain release checks; integrated quota measurement belongs to med-8f4s.15
  ios: manual  # automated by ios/UITests/HealthDiagnosticTests.swift#HealthWriteBackTests (qa job): weight upsert/delete/no-echo, the pulse as hr (write, replace, own-id filter, delete, workout average untouched) and the session workout (write, higher-version replace leaves one, activity guard, own-id filter, delete), readableFrom 0 with full access on the iOS 27 runtime and readableFromMs ([:] → 0, two types → the later date in ms), readableFrom(osMajor:) 26 → 0 and 27 threw → omitted, the equal/lower-version replay (resolves true, one object left; weight/hr/workout; a store error is true only when held() reads our id at that version or newer, its true/false cases checked) and the entries batch (10 mixed → all true, one per id; a malformed entry gets its own error, the rest saved; a batch carrying denied BP throws denied); manual release checks: Copy past entries from a second iPhone/iPad (finishes, nothing doubled), the page→bridge→HealthKit chain (save BP with pulse → one BP + one heart-rate entry by Med Tracker; clear pulse → gone; set again → back; delete → both gone; finish a session → one strength workout by Med Tracker over its span; re-complete → still one; delete → gone; a Watch workout is not duplicated), the real heart-rate and workout permission sheets, BP itself (Simulator leaves BP share notDetermined), equal/lower-version BP replay: one correlation, one member each, version kept, iOS 27 device with a "recent window" Health grant shows the HW9 cut line ("N entries before <date> won't be copied") and Copy skips them, and permission/retry
source: [Zulip 14755, Zulip 14798, Zulip 15063, Zulip 15065, med-8f4s.2, Zulip 15322, Zulip 15336, med-8f4s.6, Zulip 15354, Zulip 15356, Zulip 15360, Zulip 15649, med-8f4s.5, Zulip 15670, med-8f4s.12, Zulip 15590, Zulip 15615, Zulip 15620, med-8f4s.11, med-8f4s.17, med-8f4s.13, Zulip 16829, Zulip 16849]

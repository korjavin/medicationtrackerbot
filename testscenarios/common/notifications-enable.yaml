id: notifications-enable
title: Settings → Notifications → Enable walks system permissions and the toggle turns on
platforms: [web, android, ios]
preconditions:
  - Account mode; notifications not yet allowed on this device
steps:
  - Open Settings → Notifications
  - Tap Enable
  - Allow in the system prompt
  - On Android, if the OS no longer prompts, allow in app notification settings and return
  - On Android, allow Alarms and reminders if requested and return
invariants:
  - The system permission prompt appears right after the tap when the OS offers it; Enable never hangs
  - After allowing, the control shows as on (Disable)
  - Refusing points to the system settings and leaves Enable ready to tap again
  - A later Enable does not repeat a permission prompt the OS can no longer show
  - On Android, a non-granted runtime result without a rationale opens app notification settings
  - On Android, Enable stays pending while the system settings screen covers the app
  - On Android, returning after both grants turns the toggle on without another tap or reload
  - In the app, with notifications allowed but no push token yet, the Wake-ups line says off (not connected yet), never asks to allow notifications
covered_by:
  web: web/static/js/tests/settings.cloud-notifications.test.js
  android: manual  # partial: android/qa/scenarios/reminders-offline.mjs (first Enable/both grants/settings fallback) and android/app/src/test/java/com/example/medtracker/NotificationsTest.kt (denied/no-rationale/resume); no full refusal/second-Enable flow or allowed-without-token Wake-ups assertion
  ios: manual  # partial: ios/UITests/FlowQARemindersTests.swift#testNotificationAndOfflineReminder covers the real prompt, grant and Wake-ups off with no token; refusal and later Enable remain manual; Android-only invariants 5–7 do not apply
source: [med-nt9p.65, med-hh0e]

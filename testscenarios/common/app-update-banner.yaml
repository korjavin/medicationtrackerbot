id: app-update-banner
title: With a new build waiting, "A new version is available" shows once and Reload lands on it
platforms: [web, android, ios]
preconditions:
  - Account mode; a newer build is deployed than the one running
steps:
  - Open the app and wait for the update check
  - Tap Reload on the banner
invariants:
  - '"A new version is available." shows at most once, however often the app re-checks'
  - When the running build matches the server, no banner shows
  - Reload opens the new build (the version in Settings changes)
covered_by:
  web: tests/visual/playwright/flows.mjs#app-update-banner
  android: android/qa/scenarios/update-banner.mjs#updateBanner  # account A/B cold open, dedupe and Reload; update-resume.mjs checks real Home/return; physical-device Home/resume remains to be checked under med-jyxy; local bundled mode N/A; Play-installed update is manual release residue
  ios: ios/UITests/FlowQAUpdateBannerTests.swift#testAccountUpdateBanner  # account-mode A/B cold open, trusted Home/return visibility with no duplicate, synthetic rechecks and Reload; local mode is bundled and not applicable; TestFlight-installed update remains ios/ios-testflight-update
source: [med-kk1q.6]

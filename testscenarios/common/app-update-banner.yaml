id: app-update-banner
title: With a new build waiting, "A new version is available" shows once and Reload lands on it
platforms: [web, android, ios]
preconditions:
  - Account mode; a newer build is deployed than the one running
steps:
  - Open the app and wait for the update check
  - Tap Reload on the banner
invariants:
  - '"A new version is available." shows at most once, however often the app re-checks'
  - When the running build matches the server, no banner shows
  - Reload opens the new build (the version in Settings changes)
covered_by:
  web: tests/visual/playwright/flows.mjs#app-update-banner
  android: android/qa/scenarios/update-banner.mjs#updateBanner  # real account A/B cold open, dedupe and Reload; Home/resume visibility-delivery gap med-jyxy is non-gating; local bundled mode N/A; Play-installed update is manual release residue, not an invariant here
  ios: manual  # no iOS run yet: the account-mode cold open across two served bundles (one banner, none on a matching build, Reload lands on the new build) is med-sz4k.6.2; local mode loads the bundled app; a TestFlight-installed update is ios/ios-testflight-update
source: [med-kk1q.6]

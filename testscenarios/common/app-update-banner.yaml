id: app-update-banner
title: With a new build waiting, "A new version is available" shows once and Reload lands on it
platforms: [web, android, ios]
preconditions:
  - Account mode; a newer build is deployed than the one running
steps:
  - Open the app and wait for the update check
  - Tap Reload on the banner
invariants:
  - '"A new version is available." shows at most once, however often the app re-checks'
  - When the running build matches the server, no banner shows
  - Reload opens the new build (the version in Settings changes)
covered_by:
  web: manual  # partial: web/cloud/js/tests/update-check.test.js (prompts at most once, quiet when the build matches, Reload drives the service worker swap); missing: landing on the new build (the Settings version changes) needs two served builds (med-sz4k.2)
  android: android/qa/scenarios/update-banner.mjs#updateBanner  # real account A/B cold open, dedupe and Reload; local bundled mode N/A; Play-installed update remains manual release residue on a real device
  ios: manual
source: [med-kk1q.6]

id: meds-timeline-later-on-top
title: Meds Timeline runs later-on-top inside every day, and the overdue dose stays in reach
platforms: [web, android, ios]
preconditions:
  - A medication taken at three times a day (e.g. 08:20, 13:00 and 21:30), one dose left pending, two still ahead today
steps:
  - Open Meds → Timeline
  - Unfold "Later today", then tomorrow's Planned row
invariants:
  - Within any day of the Timeline the later dose sits above the earlier one. "Later today" is one folded Planned row above the focus card ("1 dose · 21:30", "first" only with 2+ doses; unfolded, later on top). The card shows Next today above Pending. Pending and Done sit below the card. Unfolded future days and History days also run later on top.
  - The overdue dose's Take / Skip in the focus card is visible without scrolling, however many doses are still ahead today
  - '"Show 3 more days ahead" stays the first thing on the page, and the folded future row still names the day''s first dose ("2 doses · first 08:20")'
covered_by:
  web: web/static/js/tests/meds.timeline.test.js  # invariant 2: tests/visual/scenes.json#meds-timeline-focus-in-view (inView probe, Playwright local and cloud passes: iPhone 390/440, Pixel 7, desktop)
  android: tests/visual/scenes.json#meds-timeline-focus-in-view  # invariant 2: inView probe in the android-qa local-visual dispatch (a probe failure is reported in the scene JSON, not a job failure); invariants 1 and 3 data/logic only: web/static/js/tests/meds.timeline.test.js
  ios: tests/visual/scenes.json#meds-timeline-focus-in-view  # invariant 2: inView probe in ios-visual on iPhone 16e (390pt) and 17 Pro Max (a probe failure is reported in the scene JSON, not a job failure); invariants 1 and 3 data/logic only: web/static/js/tests/meds.timeline.test.js
source: [Zulip 17050, Zulip 17054, Zulip 17139, Zulip 17140, bd med-5y49]

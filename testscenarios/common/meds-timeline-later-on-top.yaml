id: meds-timeline-later-on-top
title: Meds Timeline runs later-on-top inside every day, and the overdue dose stays in reach
platforms: [web, android, ios]
preconditions:
  - A medication taken twice a day (e.g. 08:20 and 21:30), one dose left pending, the next one still ahead today
steps:
  - Open Meds → Timeline
  - Unfold tomorrow's Planned row
invariants:
  - Within any day of the Timeline the later dose sits above the earlier one (Today's Pending, Later today and Done, an unfolded future day, a History day); the focus card shows Next today above Pending
  - The overdue dose's Take / Skip in the focus card is visible without scrolling
  - '"Show 3 more days ahead" stays the first thing on the page, and the folded future row still names the day''s first dose ("2 doses · first 08:20")'
covered_by:
  web: web/static/js/tests/meds.timeline.test.js
  android: manual
  ios: manual
source: [Zulip 17050, Zulip 17054, bd med-5y49]

id: voice-trial-call
title: Trial voice call starts, is audible, ends, and a new call starts at once
platforms: [web, android, ios]
preconditions:
  - Anonymous local-mode user with trial budget left
steps:
  - Open the voice agent and tap Call; grant the microphone
  - Hang up after the agent has spoken
  - Tap Call again
invariants:
  - Agent audio is audible within 5 s of the "listening" state
  - 'After Hang up the slot is free: a new call starts without "previous call in progress"'
  - The trial counter decreases by the seconds actually used; a failed start is not charged
  - The call connects through the minted signed URL; opening the conversation WebSocket with the agent id alone (no signature) is refused, so only a metered start can run on the operator's ElevenLabs account
covered_by:
  web: manual  # n/a on web: the anonymous trial runs only in the phone shells' local mode; on a phone it needs a live ElevenLabs call (audio, signed transport, restart, metering)
  android: manual  # live vendor audio/audibility, signed call transport, immediate restart and actual trial metering need a device call
  ios: manual  # live vendor audio/audibility, signed call transport, immediate restart and actual trial metering need a device call
source: [med-dngs, med-ytmf]

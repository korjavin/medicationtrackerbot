id: local-to-cloud
title: Moving local data into an account keeps every record; the move stash is cleared, the phone’s local copy stays
platforms: [android, ios]
preconditions:
  - The phone app in local mode with records, and Settings → Features → "Check names in" set to EU register
  - An invite to an account
steps:
  - Choose Turn on sync ("Your N records move to your account") or open the invite link
  - Create the passkey and enter the account
  - If the account already has data, pick Merge or Replace
invariants:
  - Into an empty account the records arrive with no question asked
  - An account with data asks Merge or Replace; Replace needs REPLACE typed to confirm
  - After the move the stash is cleared, so a reopen imports nothing a second time; Switch account → local mode still shows the local records
  - A failed import shows the error and keeps the local copy
  - Into an empty account, or with Replace, "Check names in" still shows EU register and the first medication save sends no name to RxNav
  - With Merge into an account that has its own settings, the account's "Check names in" choice stays; a move with nothing logged into an account with records keeps the account's choice too (both disclosed in docs/features.md)
covered_by:
  android: android/qa/scenarios/local-to-cloud-seamless.mjs#localToCloudSeamless  # Replace register carry-over and Merge account-choice rules: data/logic only, web/cloud/js/tests/cloud-boot.test.js#the "Check names in" choice (med-3u28.6) (Replace with typed REPLACE: the account shows EU and its first save calls no RxNav; Merge keeps the account's choice)
  ios: manual  # partial: ios/UITests/FlowQAStashTests.swift#testMoveLocalSide (the local half: a seeded move stash and the records survive a relaunch, Switch account drops the stash); data/logic only: web/cloud/js/tests/cloud-boot.test.js (move-pickup orchestration: empty account with no dialog, Replace confirmed with typed REPLACE, Merge, move.clear; the register choice through the pickup file); missing, owned by med-sz4k.6.4: the iOS account half (empty account, Merge/Replace with typed REPLACE, a failed import keeping the local copy, EU register carry-over)
source: [med-nt9p.32.18, med-3u28.6]

id: backup-export-restore
title: 'Export a backup, erase, restore from the file: every record is back'
platforms: [web, android, ios]
preconditions:
  - Records in every section
steps:
  - 'Settings → Backup: export a backup file'
  - Erase the data
  - Restore from the file
invariants:
  - 'Every record is back: medications and doses, BP, weight, food, workouts, sleep, settings'
  - A corrupt file is refused and nothing is erased
  - Merge keeps this device's records and adds the file's; Replace replaces them
covered_by:
  web: web/static/js/tests/cloud.local-mode.test.js#restores the golden vault fixture, and its local export is what the cloud importer reads
  android: manual
  ios: manual

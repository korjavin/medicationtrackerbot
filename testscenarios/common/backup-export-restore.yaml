id: backup-export-restore
title: 'Export a backup, erase, restore from the file: every record is back'
platforms: [web, android, ios]
preconditions:
  - Records in every section
steps:
  - 'Settings → Backup: export a backup file'
  - Erase the data
  - Restore from the file
invariants:
  - 'Every record is back: medications and doses, BP, weight, food, workouts, sleep, settings'
  - A wrong or corrupt file is refused and nothing is replaced
  - Restore from a file replaces this device’s records after the typed REPLACE confirm; it offers no Merge
covered_by:
  web: 'web/static/js/tests/settings.importexport.test.js#testscenarios: Settings → Backup over the real account store'  # export → erase → restore vs tests/fixtures/vault-v1.json; wrong/corrupt refused; Merge vs Replace
  android: android/qa/scenarios/file-backup.mjs#fileBackup  # real SAF Save/readback/erase/same-file Replace/corrupt refusal; Replace-only catalogue ruling Archie17664/Miles17666
  ios: manual  # partial: ios/UITests/FlowQABackupTests.swift#testBackupExport and #testRestoreFromFile (export to Files; erase, then restore the fixture, not the exported file; one medication checked, no corrupt file, no Merge or Replace)

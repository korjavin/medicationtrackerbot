id: voice-photo-gallery
title: During a call, a photo picked from the gallery reaches the agent and it describes it
platforms: [web, android, ios]
preconditions:
  - Account mode with the AI voice agent set up, or (iPhone and Android) the anonymous on-device trial with call time left
  - A voice call is in progress
  - The phone gallery holds at least one photo
steps:
  - Tap the gallery button in the call bar
  - Pick a photo
  - Keep talking
  - After the answer, send a second photo the same way
invariants:
  - The agent describes the picked photo on its next answer
  - While a photo is sending, both photo buttons are disabled and read "Sending…" until the agent answers; then they are ready again
  - 'A failed photo answer shows "Couldn''t send the photo: <reason>" until the next action'
  - Cancelling the picker sends nothing and the call goes on
  - On the anonymous trial call (iPhone and Android) the picked photo reaches the agent too, and it describes a detail you never said; the camera and gallery buttons are shown there
covered_by:
  web: manual  # partial: web/static/js/tests/features.elevenlabs-call.test.js (fake relay; picker and routing, not the agent describing the photo)
  android: manual  # real gallery picker into account/trial vendor audio, spoken detail, Sending/error states and cancellation need a device call
  ios: manual
source: [med-ku8r, med-adje]

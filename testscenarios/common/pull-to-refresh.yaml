id: pull-to-refresh
title: 'Account mode: pull to refresh syncs and the banner shows the real network state'
platforms: [web, android, ios]
preconditions:
  - Account mode with a second device that adds entries
steps:
  - Add an entry on the other device
  - Pull down on Today
  - Turn on airplane mode, then off again
  - Switch to a local-mode install and do the same
invariants:
  - Pull to refresh runs a sync pull (not a Health import); new entries show a toast, nothing new shows none
  - The offline banner shows only while offline and goes once the network is back
  - 'Local mode shows no sync pull gesture, no offline banner, no network chip (Health pull there runs the Health import only)'
source: [med-duj9, med-nh65]
covered_by:
  web: tests/visual/playwright/flows.mjs#pull-to-refresh  # a second device's blood pressure arrives on the pull ("Syncing…", "Synced · new entries", the row in Vitals); a pull with nothing new shows no toast; the Health import is never loaded; the offline banner only while offline; the local-mode invariant is n/a on web (local mode runs only in the phone shells)
  android: manual  # partial: android/qa/scenarios/pull-refresh.mjs (sync request/pill, Health-only local pull, real offline/online banner and local banner absence); no network-chip, second-device entry/new-row toast or no-new-entry toast assertions
  ios: manual  # partial: ios/UITests/FlowQAPullDeleteTests.swift#testPullAndDelete (account pull syncs an encrypted peer BP, "Synced · new entries" toast, quiet pull shows none); ios/UITests/FlowQAPullDeleteTests.swift#testLocalPullHasNoSyncUI (a local-mode pull shows no "Syncing…"/"Release to sync" pill and no "Offline" banner text); tests/visual/scenes.json#health-pull-native runs the local Health import. Still manual: the local-mode network chip absence; the banner on airplane mode (the Simulator has none; the listener is covered by web/static/js/tests/offline-ui.test.js) (med-sz4k.6.3.4)

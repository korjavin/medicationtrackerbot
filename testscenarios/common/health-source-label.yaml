id: health-source-label
title: Entries from Health import carry the Health import label
platforms: [web, android, ios]
preconditions:
  - Health import on, with BP, weight and sleep imported from Health Connect or Apple Health
steps:
  - Open the BP, Weight and Sleep views
  - Look at an imported entry and at one typed in by hand
invariants:
  - Imported BP, weight and sleep entries show "Health import" as their source
  - Entries typed in by hand carry no Health import label
  - Rows imported from a Mi Band backup keep showing with their label after the in-app import control is gone
covered_by:
  web: web/static/js/tests/bp.history.test.js  # BP: label on the imported row, none on typed-in ones; weight: weight.history.test.js; sleep: health.sleep.test.js; Mi Band import control gone and a retained Mi Band night keeping its label: health.summary.test.js (med-fi1k); the web renders rows synced from a phone, the import that marks them is web/cloud/js/tests/health-import.test.js
  android: manual  # pending native QA of android/qa/scenarios/health-connect.mjs (SDK BP/weight/sleep labels, distinct manual comparisons, dedupe, retained Mi Band/control absence); same package, SDK-assigned dataOrigin; real third-party origin remains manual
  ios: manual
source: [med-w6gx.32]

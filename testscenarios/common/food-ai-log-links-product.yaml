id: food-ai-log-links-product
title: An AI-described or photographed meal links the saved product, a new dish gets one product
platforms: [web, android, ios]
preconditions:
  - The food database holds "Boiled egg" and no "Kharcho"
  - An AI key or the trial AI is available
steps:
  - Describe a meal the AI reads as "boiled eggs", review and log it
  - Describe a meal the AI reads as "Kharcho", review and log it, then log it again the same way
  - Send /food with the same description to the Telegram bot
invariants:
  - The eggs log shows as "Boiled egg" with the AI's macros, and no second egg product appears
  - '"Kharcho" appears once in the food database with the AI''s per-100 g values; both logs are linked to it'
  - A Telegram /food delivered twice still leaves one log per item and one product
  - With only "Roast" saved, an AI-read "Toast" gets its own Toast product (no typo guess on AI items)
  - An item with impossible macros (protein 150 g/100 g) is logged with its warning but creates no product
  - Two devices handling the same Telegram /food end up with one product
  - Earlier AI logs keep their names, totals and missing links
  - A wrong AI match shows the product's name on the log at once and is corrected by editing the log's name, as for a typed log
  - The review shows a matched item under the product's name with the Mine tag, and Log links exactly that product, even when a busier product shares its name key ("Boiled egg" with alias "egg boiled" next to "Boiled eggs", AI reads "eggs, boiled")
  - Renaming a matched item in review drops the Mine tag and the link; it reconciles by the new name
  - An item with questionable macros shows one quiet hint line in the review; Log stays enabled
covered_by:
  web: web/static/js/tests/cloud.shim-contract.food-ai.test.js  # Telegram /food twice and two devices: web/cloud/js/tests/inbox-apply.test.js#inbox-apply.js — a Telegram data command
  android: web/static/js/tests/cloud.shim-contract.food-ai.test.js  # data/logic only (stubbed-provider reconciliation/review: web/static/js/tests/food.ai-mode.test.js); the native photo path is residue (no camera on the emulator); the Telegram /food twice and two-device assertions (web/cloud/js/tests/inbox-apply.test.js#inbox-apply.js — a Telegram data command) are tracked by med-sz4k.8
  ios: manual  # partial: data/logic only: web/static/js/tests/cloud.shim-contract.food-ai.test.js and web/static/js/tests/food.ai-mode.test.js (stubbed-provider reconciliation/review), web/cloud/js/tests/inbox-apply.test.js#inbox-apply.js — a Telegram data command (a /food delivered twice keeps one log and one product; two devices draining it converge on one product); the native photo path is epic residue (no camera on the Simulator)
source: [med-5jq.4, med-5jq.9]

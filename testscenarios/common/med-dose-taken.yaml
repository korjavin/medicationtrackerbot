id: med-dose-taken
title: Add a medication, mark a dose taken, and Today shows it as taken
platforms: [web, android, ios]
preconditions:
  - App open, any mode
steps:
  - Meds → Add a medication with a dose due now
  - Open Today and tap Take on the dose
invariants:
  - The due dose shows on Today with Take
  - After Take the dose leaves Today's Next up at once, without a reload
  - Meds → Timeline shows it as "Taken HH:MM", and it stays taken after a reload
covered_by:
  web: web/static/js/tests/cloud.shim-contract.meds.test.js#the due dose shows with Take; Take drops it from Next up at once; Timeline says Taken HH:MM, also after a reload
  android: android/qa/scenarios/core-local.mjs#dose
  ios: ios/UITests/FlowQACoreLocalTests.swift#testCoreLocal
source: [Zulip 11272]

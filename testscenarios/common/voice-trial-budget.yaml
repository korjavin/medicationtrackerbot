id: voice-trial-budget
title: Trial voice budget goes down by the seconds used; a failed start is not charged
platforms: [web, android, ios]
preconditions:
  - Anonymous local-mode user with trial voice time left today
steps:
  - Note the voice time left in Settings
  - Make a short trial call (about 30 s) and hang up
  - Start a call that fails to connect (for example with the microphone denied)
  - Check the voice time left again
invariants:
  - After the call the time left drops by about the seconds actually talked, not by a whole grant
  - A start that never connects leaves the time left unchanged
  - Two short calls in a row never exhaust the day ("Free voice calls paused until tomorrow." appears only once the day budget is really used)
  - Right after a start that never connected, a refused next start says "Try again in a few minutes." (the time comes back shortly), not "paused until tomorrow"
  - Once the day budget is really used and nothing is waiting to come back, the refusal still says "Free voice calls paused until tomorrow."
  - The consent text says each call reserves its full time limit and the time not used comes back after the call ends
covered_by:
  web: manual  # n/a on web: the anonymous trial runs only in the phone shells' local mode; on a phone it needs live trial calls (seconds talked, failed-start refund, refusal copy)
  android: manual  # real vendor call duration, failed-start refund and subsequent budget/rate-limit copy need live trial calls
  ios: manual
source: [med-dngs, med-v1uz.1, med-v1uz.3]

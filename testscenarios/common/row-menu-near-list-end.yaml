id: row-menu-near-list-end
title: A row's ⋮ menu near the end of a list stays fully visible above the tab bar
platforms: [web, ios]
preconditions:
  - A phone-size screen (390x844) with the bottom tab bar showing
  - Health → Weight (or BP, or any list with ⋮ row menus) has enough entries to scroll
steps:
  - Scroll to the end of the list
  - Tap ⋮ on the last row
invariants:
  - Every menu item, Delete included, is fully visible above the tab bar and the home indicator, and tappable
  - A row with room below still opens its menu downward, as before
covered_by:
  # Partial evidence: web/static/js/tests/weight.history.test.js ("the last row's menu opens above
  # the row": flip logic on stubbed geometry, a row with room stays down, Delete reaches its handler)
  # and tests/visual/scenes.json weight/bp/food-last-row-menu (real layout at phone size, inView
  # probe: the open menu sits wholly above the tab bar). Missing: a real finger tap on Delete.
  web: manual  # tap Delete on the last row's menu at phone size; layout is covered by the scenes above
  ios: manual  # same, on an iPhone with a home indicator
source: [bd med-l578]

id: local-first-run
title: First run without an invite works fully offline in local mode
platforms: [web, android, ios]
preconditions:
  - A fresh install with no account and no invite
  - The phone is offline
steps:
  - Open the app and go through first run without an invite
  - Log a blood pressure, a weight and a medication dose
  - Edit one entry and delete another
  - Close and reopen the app
invariants:
  - First run completes with no network and no account
  - Every log, edit and delete works and survives the reopen
  - Nothing is sent to the sync server
covered_by:
  web: manual  # n/a on web: local mode runs only in the phone shells (local-boot.js is bundled by ios/ and android/ only), so a browser has no first run without an account; the shared code is pinned by web/static/js/tests/cloud.local-mode.test.js (local CRUD with zero sync traffic; no first-run UI or reopen)
  android: android/qa/scenarios/firstrun.mjs#offline fresh install, UI log/edit/delete and force-stop reopen  # guest wifi and mobile data disabled; QA document-start gate attaches CDP before app scripts on first launch and reopen; the initial navigation is the local asset document
  ios: manual  # partial: ios/UITests/FlowQATests.swift#testLocalFirstRun (a fresh launch with no account opens the web W1, the driver seeds records, local mode persists over a relaunch); data/logic only: web/static/js/tests/cloud.local-mode.test.js (local CRUD with zero sync traffic); missing, owned by med-sz4k.6.1: BP/weight/dose log, edit and delete through the UI checked after the reopen, and no egress on the fake-server log; the Simulator stays online, so airplane mode itself stays a device clause
source: [med-ta2n]

id: local-first-run
title: First run without an invite works fully offline in local mode
platforms: [android, ios]
preconditions:
  - A fresh install with no account and no invite
  - The phone is offline
steps:
  - Open the app and go through first run without an invite
  - Log a blood pressure, a weight and a medication dose
  - Edit one entry and delete another
  - Close and reopen the app
invariants:
  - First run completes with no network and no account
  - Every log, edit and delete works and survives the reopen
  - Nothing is sent to the sync server
covered_by:
  android: android/qa/scenarios/firstrun.mjs#offline fresh install, UI log/edit/delete and force-stop reopen  # guest wifi and mobile data disabled; CDP observes egress attempts on empty-origin replay and attached pages, but initial native navigation and force-stop reopen attempts before attachment are unobserved; no TLS-front receipts while radios are down
  ios: manual  # partial: ios/UITests/FlowQATests.swift#testLocalFirstRun (a fresh launch with no account opens the web W1, the driver seeds records, local mode persists over a relaunch, no fake-server receipts); ios/UITests/FlowQACoreLocalTests.swift#testCoreLocal (BP, weight and dose logged through the UI, the BP edited, the weight deleted, checked after a relaunch, no fake-server receipts); data/logic only: web/static/js/tests/cloud.local-mode.test.js (local CRUD with zero sync traffic); the Simulator stays online, so egress is observed, not blocked: a first run with the phone offline stays a device clause
source: [med-ta2n]

id: local-first-run
title: First run without an invite works fully offline in local mode
platforms: [web, android, ios]
preconditions:
  - A fresh install with no account and no invite
  - The phone is offline
steps:
  - Open the app and go through first run without an invite
  - Log a blood pressure, a weight and a medication dose
  - Edit one entry and delete another
  - Close and reopen the app
invariants:
  - First run completes with no network and no account
  - Every log, edit and delete works and survives the reopen
  - Nothing is sent to the sync server
covered_by:
  web: web/static/js/tests/cloud.local-mode.test.js#logs, reads, edits and deletes BP, weight and a med intake with zero sync traffic
  android: manual
  ios: manual
source: [med-ta2n]

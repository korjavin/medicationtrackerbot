id: eu-register-check
title: With the EU register picked, the medication editor checks names on the phone and sends nothing
platforms: [web, android, ios]
preconditions:
  - App open; Settings → Features → "Check names in" shows US register
steps:
  - Pick EU register in "Check names in"
  - Add a medication named Candecor
  - Tap the "EU · Candesartan Cilexetil" chip
  - Save Candecor
  - Name a second medication Voltaren and tap its chip; tap "Use this" on one card, then Save
  - Go offline, reopen the app and open Candecor again
  - Pick US register again and open Candecor
  - Rename Candecor and Save
invariants:
  - The first check downloads the register once with a progress meter; Save works meanwhile
  - The sheet shows Oral Use with Germany, Slovenia, and the dated EMA source
  - Voltaren shows "EU · 3 entries" and a sheet with one card per substance
  - Offline after the first download the chip still appears (the register is stored on the phone)
  - With EU picked no RxNav request is made; a medication's saved Rx match stays while its name is unchanged
  - Back on US register the Rx chip path runs as before and the EU register is not fetched
  - With an account the choice syncs: another device of the account shows the same register after a pull, and its next check follows it without a reload
  - Saving Candecor (one entry) stores the match with the medication, no extra step; the Meds list row shows "EU Candesartan Cilexetil", also offline
  - For Voltaren "Use this" on a card closes the sheet, the chip names it, the sheet then says "Picked" on it; Save keeps that pick
  - Reopened offline, the editor shows the saved match ("Saved EU entry · Rev.<n>, data of <date>") from the record
  - Renaming the medication clears the saved match; switching back to US register keeps it
  - Save never waits for the register: still loading, failed, several unpicked or no match all save the medication without a match
covered_by:
  web: tests/visual/playwright/flows.mjs#eu-register-check  # the account choice: device A picks EU, device B's pull to refresh, B's Settings shows EU register and its next check (Candecor) is the EU chip with zero RxNav requests and no reload; Candecor and Voltaren chips and sheets, first-download progress, Save while loading, the US path: web/static/js/tests/meds.modal.test.js; no RxNav request, kept Rx match, US switch-back loads nothing, and "saved EU register match" (one entry saved on Save, Use this → Picked → Save, list "EU …" row, offline reopen chip from the record, rename clears, US keeps, never blocking): web/static/js/tests/cloud.shim-contract.meds.test.js; one download, cache-first reopen with no network: web/cloud/js/tests/ema.test.js
  android: android/qa/scenarios/eu-register.mjs#euRegister  # cold bundled download progress + Save with a gated real response; offline cold reopen shows cached chip, saved record and dated entry; local US switch-back: the editor's rx-check call runs and no register asset is requested (local mode has no RxNav port by design, so no chip there); account: simulated encrypted peer settings op, native pull, EU choice and next chip without reload. Data/logic only: web/static/js/tests/meds.modal.test.js (chip from rx-check answer, sheet and loading states), web/static/js/tests/cloud.shim-contract.meds.test.js (kept Rx match, saved EU match, Use this/Picked, rename clears, US keeps and Save does not wait), web/cloud/js/tests/ema.test.js (cache-first and single load)
  ios: ios/UITests/FlowQAEURegisterTests.swift#testEURegister,testAccountEURegister  # local US and EU choice plus account cold reopen with the fake server stopped (Simulator has no airplane mode), saved Candecor match, synthetic-name/RxNav egress observation and encrypted peer setting applied by native pull without reload; data/logic only: web/static/js/tests/meds.modal.test.js (Candecor and Voltaren chips and sheets, first-download progress, Save while loading, the US path), web/static/js/tests/cloud.shim-contract.meds.test.js (kept Rx match, saved EU match, Use this → Picked, rename clears, US keeps, never blocking), web/cloud/js/tests/ema.test.js (one download, cache-first reopen)

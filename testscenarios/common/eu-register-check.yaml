id: eu-register-check
title: With the EU register picked, the medication editor checks names on the phone and sends nothing
platforms: [web, android, ios]
preconditions:
  - App open; Settings → Features → "Check names in" shows US register
steps:
  - Pick EU register in "Check names in"
  - Add a medication named Candecor
  - Tap the "EU · Candesartan Cilexetil" chip
  - Name a second medication Voltaren and tap its chip
  - Go offline, reopen the app and open Candecor again
  - Pick US register again and open Candecor
invariants:
  - The first check downloads the register once with a progress meter; Save works meanwhile
  - The sheet shows Oral Use with Germany, Slovenia, and the dated EMA source
  - Voltaren shows "EU · 3 entries" and a sheet with one card per substance
  - Offline after the first download the chip still appears (the register is stored on the phone)
  - With EU picked no RxNav request is made; a medication's saved Rx match stays while its name is unchanged
  - Back on US register the Rx chip path runs as before and the EU register is not fetched
  - With an account the choice syncs: another device of the account shows the same register after a pull, and its next check follows it without a reload
covered_by:
  web: tests/visual/playwright/flows.mjs#eu-register-check  # the account choice: device A picks EU, device B's pull to refresh, B's Settings shows EU register and its next check (Candecor) is the EU chip with zero RxNav requests and no reload; Candecor and Voltaren chips and sheets, first-download progress, Save while loading, the US path: web/static/js/tests/meds.modal.test.js; no RxNav request, kept Rx match, US switch-back loads nothing: web/static/js/tests/cloud.shim-contract.meds.test.js; one download, cache-first reopen with no network: web/cloud/js/tests/ema.test.js
  android: manual  # partial: android/qa/scenarios/eu-register.mjs (local choice/cache/relaunch, Candecor countries/route/source, Voltaren cards, observed name/RxNav egress guard); no actual offline check, US switch, first-download Save/progress, unchanged Rx match or account-choice sync
  ios: manual  # partial: ios/UITests/FlowQAEURegisterTests.swift (local mode: US checks nothing, Settings pick survives a relaunch, Candecor chip + sheet, cache-first relaunch); not Voltaren, offline or the account-mode US path
source: [med-3u28.2, med-3u28.6]

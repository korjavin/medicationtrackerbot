id: boot-degraded-reload
title: Failed boot shows "Some saved data did not load. Reload to fix."; Reload recovers offline
platforms: [web, android, ios]
preconditions:
  - Account mode; a step after unlock fails to load (for example a partly cached update while offline)
steps:
  - Open and unlock the app
  - Tap Reload on the banner
invariants:
  - Exactly one banner shows, with "Some saved data did not load. Reload to fix." and a Reload button
  - This banner replaces an update banner that was already up
  - An empty state caused by the failure says Reload, not "no data"
  - Reload loads the current build and works offline
covered_by:
  web: tests/visual/playwright/flows.mjs#boot-degraded-reload
  android: manual  # load-error.mjs covers native host-down N4 only; no degraded post-unlock banner, replacement/empty-state or offline recovery run (med-sz4k.4.2)
  ios: manual
source: [med-kk1q.4]

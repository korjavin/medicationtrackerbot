id: invite-claim
title: Opening an invite link creates a passkey and lands in the account with the kit offer
platforms: [web, android, ios]
preconditions:
  - A fresh install or browser with no account
  - An unclaimed invite link whose claim fragment carries &kit=1 (without it there is no kit offer)
steps:
  - Open the invite link
  - Create the passkey with Face ID, fingerprint or the device PIN
  - On the Emergency Kit offer, save or print it, or tap Done
invariants:
  - A pending invite shows the passkey button; an already-claimed link shows the already-claimed screen and no passkey button
  - An expired link says so
  - After the passkey the Emergency Kit offer shows; Done enters the account without a second sign-in
covered_by:
  web: web/cloud/js/tests/signup.claimed-link.test.js
  android: manual  # partial: android/qa/scenarios/smoke.mjs#claimAccount (pending invite, passkey, kit offer, Done; no expired or claimed link)
  ios: manual
source: [med-ta2n]

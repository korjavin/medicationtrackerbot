id: delete-account
title: Deleting the account removes the data and signs the device out
platforms: [web, android, ios]
preconditions:
  - Account mode with data
steps:
  - In Settings tap Delete account
  - Type DELETE to confirm
  - Confirm with the passkey
invariants:
  - Delete needs the confirm phrase and a fresh passkey check; cancelling the passkey deletes nothing
  - After delete the local data and caches on this device are wiped and push is turned off
  - The device lands outside the account and the account no longer opens
  - Cancelling or failing the passkey never loses unsynced entries; delete is refused while entries are unsynced
source: [med-kraa]
covered_by:
  web: web/static/js/tests/settings.toggles.test.js  # Settings: typed DELETE gate, a drain before the pre-wipe and a refusal (no wipe, no DELETE) while entries are unsynced or the drain fails, Cancel deletes nothing, a cancelled passkey leaves the account and stays put, a finished delete wipes and leaves; re-auth before DELETE, a cancelled passkey never DELETEs, the IDB/cache/push/service-worker wipe: web/cloud/js/tests/account-delete.test.js; the account and its session gone: internal/cloudserver/account_test.go#TestAccountDelete_HappyPath
  android: manual  # partial: android/qa/scenarios/delete-account.mjs (typed confirm/delete, host forgotten, local F1/relaunch); no passkey-cancel preservation, comprehensive cache wipe, push unregistration or deleted-host rejection
  ios: manual  # partial: ios/UITests/FlowQAAccountGoneTests.swift#testAccountGone (a host answering 404 + X-Account-Gone is forgotten and the app lands in local mode on "Have an invite?"); no Delete account flow, typed DELETE, passkey re-check or cancel, local data/cache wipe or push off (med-sz4k.6.3)

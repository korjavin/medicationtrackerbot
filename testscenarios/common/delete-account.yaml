id: delete-account
title: Deleting the account removes the data and signs the device out
platforms: [web, android, ios]
preconditions:
  - Account mode with data
steps:
  - In Settings tap Delete account
  - Type DELETE to confirm
  - Confirm with the passkey
invariants:
  - Delete needs the confirm phrase and a fresh passkey check; cancelling the passkey deletes nothing
  - After delete the local data and caches on this device are wiped and push is turned off
  - The device lands outside the account and the account no longer opens
  - Cancelling or failing the passkey never loses entries saved before Delete without a warning: when entries are unsynced or can never sync, Delete warns first (Export backup / Continue / Cancel) and wipes nothing unless Continue is picked
source: [med-kraa]
covered_by:
  web: web/static/js/tests/settings.toggles.test.js  # Settings: typed DELETE gate, a drain before the pre-wipe and an Export backup / Continue / Cancel warning (no wipe, no DELETE unless Continue) while entries are unsynced, an import waits or was rejected, or the drain fails or times out, Cancel deletes nothing, a cancelled passkey leaves the account and stays put, a finished delete wipes and leaves; re-auth before DELETE, a cancelled passkey never DELETEs, the IDB/cache/push/service-worker wipe: web/cloud/js/tests/account-delete.test.js; the account and its session gone: internal/cloudserver/account_test.go#TestAccountDelete_HappyPath
  android: manual  # partial: android/qa/scenarios/delete-account.mjs (typed confirm/delete, host forgotten, local F1/relaunch); no passkey-cancel preservation, comprehensive cache wipe, push unregistration or deleted-host rejection
  ios: ios/UITests/FlowQAPullDeleteTests.swift#testPullAndDelete  # asserts the typed DELETE gate, real reauth with a cancelled passkey deleting nothing (account BP back after relaunch), a verified DELETE 204, IndexedDB and caches empty before leave, host forgotten and "Have an invite?", and the deleted host answering 404 and landing on "Have an invite?" (passkey via the QA soft authenticator; the native sheet's cancel/confirm: device check); push off: no /api/push/* call after the DELETE, server rows by internal/cloudstore/delete_account_test.go; native APNs token deregistration on a Push-entitled build: device check; the unsynced-entries warning (invariant 4, Export backup / Continue / Cancel): shared web code, web/static/js/tests/settings.toggles.test.js, not run on iOS (med-sz4k.6.3.4)

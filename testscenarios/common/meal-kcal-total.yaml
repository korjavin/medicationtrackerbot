id: meal-kcal-total
title: Log a meal, and today's calorie total includes it
platforms: [web, android, ios]
preconditions:
  - App open with food tracking on
steps:
  - Food → Add a meal with known calories
  - Look at the day total on Food and on Today
invariants:
  - The meal's kcal is in today's total right after saving
  - A meal logged now counts toward today, not only in the list
covered_by:
  web: manual  # partial: web/static/js/tests/cloud.shim-contract.food-log.test.js (the day stats sum); missing: save a meal, then the Food and Today totals on screen include it (med-sz4k.2)
  android: android/qa/scenarios/core-local.mjs#meal
  ios: manual
source: [Zulip 11272]

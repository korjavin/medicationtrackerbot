id: open-sheet-holds-refresh
title: 'Nothing covers or reloads an open sheet or workout session; data that changed elsewhere appears after it closes'
platforms: [web, android, ios]
preconditions:
  - Account mode with Health import on and a second device that adds entries
steps:
  - Start a workout and keep the session open on a set
  - Lock the phone for a minute, walk around, unlock it (a Health pass runs)
  - Turn airplane mode on and off
  - Add a BP reading on the other device
  - Type in the session's Notes field
  - Close the session
invariants:
  - While the session is open no bar, banner or toast about new data appears, and nothing under the user's hands reloads
  - A field being typed in is never reloaded, with or without a sheet open
  - After the session closes the current tab shows the other device's entry and the Health data without a manual refresh
source: [med-vhdk]
covered_by:
  web: web/static/js/tests/app.refresh-dispatch.test.js
  android: manual  # web/static/js/tests/app.refresh-dispatch.test.js proves shared hold/apply logic only; no Android workout/field editing across background, Health import, radios and second-device changes through close/recovery
  ios: manual  # partial: data/logic only: web/static/js/tests/app.refresh-dispatch.test.js (shared hold/apply logic: held under an open session, sheet or focused field, applied on close or blur); missing, owned by med-sz4k.6.4: an iOS session open across home/relaunch while a fake-server BP arrives: no toast, Notes untouched, the entry shown after close

version: '3'

# Cloud-mode app stack: single `cloud` service, deployed as a Portainer
# gitops stack from this repo's `deploy` branch (webhook-redeployed by
# .github/workflows/deploy.yml, same pattern as the bot stack). Joins the
# `proxy` network created by docker-compose.infra.cloud.yml. See
# docs/cloud-deployment.md.

services:
  cloud:
    image: ghcr.io/korjavin/medicationtrackerbot:latest
    container_name: medtracker-cloud
    restart: unless-stopped
    command: ["./cloud"]
    volumes:
      - cloud_data:/app/data
    environment:
      - CLOUD_BASE_DOMAIN=${CLOUD_BASE_DOMAIN}
      - SESSION_SECRET=${SESSION_SECRET}
      - CLOUD_DB_PATH=${CLOUD_DB_PATH:-/app/data/cloud.db}
      - PORT=${PORT:-8080}
      - CLOUD_CLAIM_TTL=${CLOUD_CLAIM_TTL:-14}
      - CLOUD_ACCOUNT_QUOTA_BYTES=${CLOUD_ACCOUNT_QUOTA_BYTES:-}
      - CLOUD_DRY_QUEUE_WARN_HOURS=${CLOUD_DRY_QUEUE_WARN_HOURS:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - MANAGER_BOT_TOKEN=${MANAGER_BOT_TOKEN:-}
      - CLOUD_FOOD_DB_URL=${CLOUD_FOOD_DB_URL:-}
      # Operator key for a KEYED food DB, forwarded upstream as X-API-Key.
      # Without it a keyed instance 401s and food search stays broken even
      # though CLOUD_FOOD_DB_URL is set. Never reaches the browser.
      - CLOUD_FOOD_DB_API_KEY=${CLOUD_FOOD_DB_API_KEY:-}
      - CLOUD_TG_API_BASE_URL=${CLOUD_TG_API_BASE_URL:-}
      # Operator TRIAL provider keys (all optional; unset = pure BYO, trial
      # proxy routes 503). Read by cmd/cloud/main.go via TrialConfigFromEnv.
      # Voice needs BOTH TRIAL_ELEVENLABS_* set or the trial flag stays off.
      # See docs/environment.md → Trial provider keys.
      - TRIAL_OPENAI_API_KEY=${TRIAL_OPENAI_API_KEY:-}
      - TRIAL_OPENAI_URL=${TRIAL_OPENAI_URL:-}
      - TRIAL_OPENAI_MODEL=${TRIAL_OPENAI_MODEL:-}
      - TRIAL_OPENAI_VISION_API_KEY=${TRIAL_OPENAI_VISION_API_KEY:-}
      - TRIAL_OPENAI_VISION_URL=${TRIAL_OPENAI_VISION_URL:-}
      - TRIAL_OPENAI_VISION_MODEL=${TRIAL_OPENAI_VISION_MODEL:-}
      - TRIAL_ELEVENLABS_API_KEY=${TRIAL_ELEVENLABS_API_KEY:-}
      - TRIAL_ELEVENLABS_AGENT_ID=${TRIAL_ELEVENLABS_AGENT_ID:-}
      - TRIAL_RATE_PER_MIN=${TRIAL_RATE_PER_MIN:-}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cloud.rule=HostRegexp(`^.+\\.${CLOUD_BASE_DOMAIN}$$`) || Host(`${CLOUD_BASE_DOMAIN}`)"
      - "traefik.http.routers.cloud.entrypoints=websecure"
      - "traefik.http.routers.cloud.tls.certresolver=wildcard"
      - "traefik.http.routers.cloud.tls.domains[0].main=${CLOUD_BASE_DOMAIN}"
      - "traefik.http.routers.cloud.tls.domains[0].sans=*.${CLOUD_BASE_DOMAIN}"
      - "traefik.http.services.cloud.loadbalancer.server.port=${PORT:-8080}"

networks:
  proxy:
    external: true

volumes:
  cloud_data:

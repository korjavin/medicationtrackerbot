version: '3'

# Cloud-mode app stack: single `cloud` service, deployed as a Portainer
# gitops stack from this repo's `deploy` branch (webhook-redeployed by
# .github/workflows/deploy.yml, same pattern as the bot stack). Joins the
# `proxy` network created by docker-compose.infra.cloud.yml. See
# docs/cloud-deployment.md.

services:
  cloud:
    image: ghcr.io/korjavin/medicationtrackerbot:latest
    container_name: medtracker-cloud
    restart: unless-stopped
    command: ["./cloud"]
    volumes:
      - cloud_data:/app/data
      # Shared with the telegram-bot-api service below. When the local Bot API
      # proxy is enabled, getFile returns an absolute path on this volume and
      # the cloud app reads the bytes directly (downloadDocument's os.Open
      # branch) — needed for Mi Band / large-file (>20 MB) imports. Harmless
      # when the proxy is off (nothing writes here).
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    environment:
      - CLOUD_BASE_DOMAIN=${CLOUD_BASE_DOMAIN}
      - SESSION_SECRET=${SESSION_SECRET}
      - CLOUD_DB_PATH=${CLOUD_DB_PATH:-/app/data/cloud.db}
      - PORT=${PORT:-8080}
      - CLOUD_CLAIM_TTL=${CLOUD_CLAIM_TTL:-14}
      # Per-account storage quota. Explicit rather than `:-` empty: an empty
      # value merely falls through to cmd/cloud's own 50MB default, which works
      # but reads like "no quota" to anyone skimming this file. 0 disables it,
      # and one runaway account can then fill cloud_data and wedge writes for
      # every other account on the box.
      - CLOUD_ACCOUNT_QUOTA_BYTES=${CLOUD_ACCOUNT_QUOTA_BYTES:-52428800}
      - CLOUD_DRY_QUEUE_WARN_HOURS=${CLOUD_DRY_QUEUE_WARN_HOURS:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - REQUEST_INVITE_EMAIL=${REQUEST_INVITE_EMAIL:-}
      # age X25519 recipient pubkey for the cloud feedback channel (bd med-dni).
      # Unset = feedback disabled: no meta tag reaches the browser and
      # POST /api/feedback returns 503. Public key only, never a secret.
      - FEEDBACK_AGE_RECIPIENT=${FEEDBACK_AGE_RECIPIENT:-}
      # Numeric Telegram chat id the manager bot DMs when feedback arrives.
      # Web feedback pings METADATA ONLY (kind + app version + time) — the
      # server holds ciphertext it cannot read; telegram-origin feedback is
      # relayed in full. Unset/0 = no relay. Needs MANAGER_BOT_TOKEN too.
      - FEEDBACK_ADMIN_CHAT_ID=${FEEDBACK_ADMIN_CHAT_ID:-}
      - MANAGER_BOT_TOKEN=${MANAGER_BOT_TOKEN:-}
      - CLOUD_FOOD_DB_URL=${CLOUD_FOOD_DB_URL:-}
      # Operator key for a KEYED food DB, forwarded upstream as X-API-Key.
      # Without it a keyed instance 401s and food search stays broken even
      # though CLOUD_FOOD_DB_URL is set. Never reaches the browser.
      - CLOUD_FOOD_DB_API_KEY=${CLOUD_FOOD_DB_API_KEY:-}
      # Optional local Bot API proxy for large-file (>20 MB) imports, e.g. Mi
      # Band backups. Left empty = the app hits api.telegram.org (20 MB getFile
      # cap). To enable, set TELEGRAM_API_ID / TELEGRAM_API_HASH (starts the
      # telegram-bot-api service below) AND point this at it:
      # CLOUD_TG_API_BASE_URL=http://telegram-bot-api:8081. See
      # docs/cloud-deployment.md → Large-file / Mi Band imports.
      - CLOUD_TG_API_BASE_URL=${CLOUD_TG_API_BASE_URL:-}
      # Internal docker-network origin the local Bot API proxy uses to deliver
      # child-bot webhooks: in --local mode the proxy delivers callbacks itself
      # and can't resolve the public host (it hairpins to loopback), so migrated /
      # proxy-created bots register http://cloud:8080/tg/bot/... instead. Only
      # applied when CLOUD_TG_API_BASE_URL is set; default matches this service +
      # PORT. See docs/cloud-deployment.md → Large-file / Mi Band imports (bd med-eas.46).
      - CLOUD_INTERNAL_WEBHOOK_BASE=${CLOUD_INTERNAL_WEBHOOK_BASE:-http://cloud:8080}
      # Operator TRIAL provider keys (all optional; unset = pure BYO, trial
      # proxy routes 503). Read by cmd/cloud/main.go via TrialConfigFromEnv.
      # Voice needs BOTH TRIAL_ELEVENLABS_* set or the trial flag stays off.
      # See docs/environment.md → Trial provider keys.
      - TRIAL_OPENAI_API_KEY=${TRIAL_OPENAI_API_KEY:-}
      - TRIAL_OPENAI_URL=${TRIAL_OPENAI_URL:-}
      - TRIAL_OPENAI_MODEL=${TRIAL_OPENAI_MODEL:-}
      - TRIAL_OPENAI_VISION_API_KEY=${TRIAL_OPENAI_VISION_API_KEY:-}
      - TRIAL_OPENAI_VISION_URL=${TRIAL_OPENAI_VISION_URL:-}
      - TRIAL_OPENAI_VISION_MODEL=${TRIAL_OPENAI_VISION_MODEL:-}
      - TRIAL_ELEVENLABS_API_KEY=${TRIAL_ELEVENLABS_API_KEY:-}
      - TRIAL_ELEVENLABS_AGENT_ID=${TRIAL_ELEVENLABS_AGENT_ID:-}
      - TRIAL_RATE_PER_MIN=${TRIAL_RATE_PER_MIN:-}
      # Daily SPEND caps on the operator's own provider key (bd med-d5t.5).
      # TRIAL_RATE_PER_MIN only smooths bursts; these bound the bill. 0 disables.
      - TRIAL_DAILY_PER_ACCOUNT=${TRIAL_DAILY_PER_ACCOUNT:-}
      - TRIAL_DAILY_GLOBAL=${TRIAL_DAILY_GLOBAL:-}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.cloud.rule=HostRegexp(`^.+\\.${CLOUD_BASE_DOMAIN}$$`) || Host(`${CLOUD_BASE_DOMAIN}`)"
      - "traefik.http.routers.cloud.entrypoints=websecure"
      - "traefik.http.routers.cloud.tls.certresolver=wildcard"
      - "traefik.http.routers.cloud.tls.domains[0].main=${CLOUD_BASE_DOMAIN}"
      - "traefik.http.routers.cloud.tls.domains[0].sans=*.${CLOUD_BASE_DOMAIN}"
      - "traefik.http.services.cloud.loadbalancer.server.port=${PORT:-8080}"

  # Local Telegram Bot API Server - removes the 20MB file download limit so
  # large Mi Band (.nxk) backups can be imported over the cloud child bots.
  # OPT-IN: skipped via clean exit when TELEGRAM_API_ID / TELEGRAM_API_HASH are
  # unset, in which case the cloud app keeps using api.telegram.org exactly as
  # before. To use it,
  # set the two creds AND CLOUD_TG_API_BASE_URL=http://telegram-bot-api:8081 on
  # the cloud service above; the shared telegram_bot_api_data volume lets the
  # app read downloaded files off disk.
  telegram-bot-api:
    image: ghcr.io/korjavin/telegram-bot-api:2026-02-28
    pull_policy: if_not_present
    container_name: medtracker-cloud-telegram-api
    restart: on-failure
    user: "0:0"
    # Default entrypoint forces user 101. We override it to run our own setup.
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # If the operator hasn't provisioned Telegram Bot API credentials,
        # exit cleanly so the container doesn't crash-loop. Combined with
        # restart: on-failure, this leaves the service inactive instead.
        if [ -z "$${TELEGRAM_API_ID}" ] || [ -z "$${TELEGRAM_API_HASH}" ]; then
          echo "[telegram-bot-api] TELEGRAM_API_ID / TELEGRAM_API_HASH not set, skipping"
          exit 0
        fi

        # Create appuser (1000) manually by modifying /etc/passwd if not exists
        # This avoids dependency on adduser/useradd which are missing in minimal images
        grep -q :1000: /etc/group || echo "appgroup:x:1000:" >> /etc/group
        grep -q :1000: /etc/passwd || echo "appuser:x:1000:1000:appuser:/var/lib/telegram-bot-api:/bin/sh" >> /etc/passwd

        # Fix permissions so appuser can write
        mkdir -p /var/lib/telegram-bot-api/data
        chown -R 1000:1000 /var/lib/telegram-bot-api

        # Run server, telling it to switch to our new user
        # We start as root, let the binary drop privileges to appuser (1000)
        # --verbosity=2 logs webhook delivery attempts/errors: in --local mode the
        # proxy delivers webhooks itself, so a bad target (e.g. an unreachable
        # public host) is otherwise silent on both sides (bd med-eas.46).
        exec telegram-bot-api --local \
          --api-id=$${TELEGRAM_API_ID} \
          --api-hash=$${TELEGRAM_API_HASH} \
          --dir=/var/lib/telegram-bot-api/data \
          --temp-dir=/tmp \
          --username=appuser \
          --groupname=appgroup \
          --verbosity=2 \
          --http-port=8081
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    networks:
      - proxy

  # Litestream - SQLite replication of cloud.db to Cloudflare R2.
  # cloud.db holds every account record, device envelope, recovery verifier
  # and all vault ciphertext. Because the system is zero-knowledge, this DB
  # *is* the vault: losing the volume loses the data AND every recovery code
  # that would let an account back in. There is no second copy anywhere else.
  #
  # Missing credentials therefore FAIL the container (exit 1, restarting
  # forever under restart: on-failure) rather than exiting 0: this service
  # silently skipped for weeks on prod and "exited (0)" read as healthy at a
  # glance, so the cloud DB had no off-host copy at all (bd med-lhee).
  # LITESTREAM_DISABLED=1 is the explicit opt-out — a clean exit that, under
  # restart: on-failure, stays exited (that is why the policy is on-failure and
  # not unless-stopped, which would restart even a deliberate exit 0).
  # Verify + restore runbook: docs/cloud-deployment.md → Backups and restore.
  litestream:
    image: ghcr.io/korjavin/litestream:0.3.13
    pull_policy: if_not_present
    container_name: medtracker-cloud-litestream
    restart: on-failure
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -n "$${LITESTREAM_DISABLED}" ]; then
          echo "[litestream] LITESTREAM_DISABLED set: replication OFF, this deployment has NO off-host backup of cloud.db"
          exit 0
        fi
        missing=""
        [ -n "$${R2_BUCKET}" ] || missing="$${missing} R2_BUCKET"
        [ -n "$${LITESTREAM_ACCESS_KEY_ID}" ] || missing="$${missing} LITESTREAM_ACCESS_KEY_ID"
        [ -n "$${LITESTREAM_SECRET_ACCESS_KEY}" ] || missing="$${missing} LITESTREAM_SECRET_ACCESS_KEY"
        if [ -n "$${missing}" ]; then
          echo "[litestream] FATAL: cloud.db has NO off-host backup. Missing env:$${missing}"
          echo "[litestream] Set them on the cloud-server stack, or set LITESTREAM_DISABLED=1 to acknowledge running with no backup."
          # Slow the restart loop so the reason stays readable in `docker logs`.
          sleep 30
          exit 1
        fi
        cat << EOF > /tmp/litestream.yml
        retention:
          enabled: $${LITESTREAM_RETENTION_ENABLED:-false}
        levels:
          - interval: $${LITESTREAM_LEVEL_1_INTERVAL:-4h}
          - interval: $${LITESTREAM_LEVEL_2_INTERVAL:-24h}
          - interval: $${LITESTREAM_LEVEL_3_INTERVAL:-168h}
        snapshot:
          interval: $${LITESTREAM_SNAPSHOT_INTERVAL:-240h}
          retention: $${LITESTREAM_RETENTION:-1680h}
        l0-retention: $${LITESTREAM_L0_RETENTION:-24h}
        l0-retention-check-interval: $${LITESTREAM_L0_RETENTION_CHECK_INTERVAL:-24h}
        dbs:
          - path: $${CLOUD_DB_PATH:-/app/data/cloud.db}
            replica:
              type: s3
              bucket: $${R2_BUCKET}
              path: $${LITESTREAM_PATH:-medtracker-cloud}
              endpoint: $${R2_ENDPOINT}
              sync-interval: $${LITESTREAM_SYNC_INTERVAL:-1h}
        EOF
        exec litestream replicate -config /tmp/litestream.yml
    volumes:
      - cloud_data:/app/data
    environment:
      - CLOUD_DB_PATH=${CLOUD_DB_PATH:-/app/data/cloud.db}
      # Explicit opt-out for local dev / a deployment that knowingly runs with
      # no off-host backup. Anything else is a hard failure, on purpose.
      - LITESTREAM_DISABLED=${LITESTREAM_DISABLED:-}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
      - LITESTREAM_PATH=${LITESTREAM_PATH:-medtracker-cloud}
      - LITESTREAM_SYNC_INTERVAL=${LITESTREAM_SYNC_INTERVAL:-1h}
      - LITESTREAM_SNAPSHOT_INTERVAL=${LITESTREAM_SNAPSHOT_INTERVAL:-240h}
      - LITESTREAM_RETENTION=${LITESTREAM_RETENTION:-1680h}
      - LITESTREAM_RETENTION_ENABLED=${LITESTREAM_RETENTION_ENABLED:-false}
      - LITESTREAM_LEVEL_1_INTERVAL=${LITESTREAM_LEVEL_1_INTERVAL:-4h}
      - LITESTREAM_LEVEL_2_INTERVAL=${LITESTREAM_LEVEL_2_INTERVAL:-24h}
      - LITESTREAM_LEVEL_3_INTERVAL=${LITESTREAM_LEVEL_3_INTERVAL:-168h}
      - LITESTREAM_L0_RETENTION=${LITESTREAM_L0_RETENTION:-24h}
      - LITESTREAM_L0_RETENTION_CHECK_INTERVAL=${LITESTREAM_L0_RETENTION_CHECK_INTERVAL:-24h}
    depends_on:
      - cloud

networks:
  proxy:
    external: true

volumes:
  cloud_data:
  telegram_bot_api_data:

// medtracker.build.gradle
//
// Add to capacitor/android/app/build.gradle:
//
//   apply from: 'medtracker.build.gradle'
//
// at the bottom of the file (after the existing `apply from: 'capacitor.build.gradle'`).
//
// apply-overlay.sh prints a reminder if it detects this line is missing.
//
// Why a separate file? capacitor/android/app/build.gradle is regenerated by
// `npx cap add android`; we can't safely full-file-overlay it because it
// embeds repository-relative paths and Capacitor-version-specific config. A
// one-line `apply from` is the smallest possible patch that survives Capacitor
// upgrades.

dependencies {
    // EncryptedSharedPreferences for the per-install session secret.
    // The local resolver ignores cookies so this is not security-meaningful,
    // but storing the value encrypted at rest is a low-cost hardening step
    // that keeps the path consistent if cookie-auth is ever re-introduced.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // OkHttp for the /healthz poll. Capacitor 6 already pulls okhttp3 in via
    // capacitor-android, so this is a no-op on the dependency graph in
    // practice — declaring it here documents the direct dependency for grep.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Coroutines for the lifecycleScope + Dispatchers.IO bootstrap path.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // androidTest dependencies for the GoServerService instrumentation suite.
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "com.squareup.okhttp3:okhttp:4.12.0"
}

version: '3'

services:
  medtracker:
    image: ghcr.io/korjavin/medicationtrackerbot:latest
    container_name: medtracker-${INSTANCE}
    restart: unless-stopped
    volumes:
      - medtracker_data:/app/data
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_USER_ID=${ALLOWED_USER_ID}
      - MCP_AUDIT_SECRET=${MCP_AUDIT_SECRET}
      - DB_PATH=${DB_PATH:-/app/data/meds.db}
      - PORT=${PORT:-8080}
      - TZ=${TZ:-Europe/Berlin}
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_TRUST_PROXY=${AUTH_TRUST_PROXY}
      - APP_DOMAIN=${DOMAIN}
      - MCP_DOMAIN=${MCP_DOMAIN}
      # MCP_SERVER_URL is the public URL the browser uses to reach the MCP
      # server. The bot uses it to mint ElevenLabs voice MCP session tokens
      # (POST /api/elevenlabs/mcp-session-token); without it that endpoint
      # returns 503 and the voice client tools degrade silently.
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - POCKET_ID_DOMAIN=${POCKET_ID_DOMAIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_AUTH_URL=${OIDC_AUTH_URL}
      - OIDC_TOKEN_URL=${OIDC_TOKEN_URL}
      - OIDC_USERINFO_URL=${OIDC_USERINFO_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URL=${OIDC_REDIRECT_URL}
      - OIDC_ADMIN_EMAIL=${OIDC_ADMIN_EMAIL}
      - OIDC_ALLOWED_SUBJECT=${OIDC_ALLOWED_SUBJECT}
      - OIDC_BUTTON_LABEL=${OIDC_BUTTON_LABEL}
      - OIDC_BUTTON_COLOR=${OIDC_BUTTON_COLOR}
      - OIDC_BUTTON_TEXT_COLOR=${OIDC_BUTTON_TEXT_COLOR}
      - OIDC_SCOPES=${OIDC_SCOPES}
      - TELEGRAM_API_ENDPOINT=${TELEGRAM_API_ENDPOINT:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - FOOD_DOMAIN=${FOOD_DOMAIN}
      - FOOD_API_URL=${FOOD_API_URL}
      - FOOD_API_KEY=${FOOD_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_URL=${OPENAI_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      # Optional split-provider config for food-photo (vision) requests.
      # Each var falls back to its OPENAI_* counterpart when unset. Use this
      # when the primary provider is text-only (e.g. DeepSeek) and a separate
      # vision-capable model (e.g. gemini-2.0-flash, gpt-4o-mini) handles photos.
      - OPENAI_VISION_API_KEY=${OPENAI_VISION_API_KEY}
      - OPENAI_VISION_URL=${OPENAI_VISION_URL}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL}
      - EXTERNAL_WORKOUT_API_KEY=${EXTERNAL_WORKOUT_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_AGENT_ID=${ELEVENLABS_AGENT_ID}
    networks:
      - default
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK_NAME}"
      - "traefik.http.routers.medtracker-${INSTANCE}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.medtracker-${INSTANCE}.entrypoints=websecure"
      - "traefik.http.routers.medtracker-${INSTANCE}.tls.certresolver=myresolver"
      - "traefik.http.services.medtracker-${INSTANCE}.loadbalancer.server.port=${PORT:-8080}"

  mcp-server:
    image: ghcr.io/korjavin/medicationtrackerbot:latest
    container_name: medtracker-mcp-${INSTANCE}
    restart: unless-stopped
    command: ["./mcptool"]
    volumes:
      - medtracker_data:/app/data
    # Do NOT mount the Docker socket here. The MCP container must not be
    # able to spawn arbitrary containers; subprocess sandboxing happens via
    # the runner image / process isolation, not container-in-container.
    environment:
      - MCP_PORT=${MCP_PORT:-8081}
      - MCP_DATABASE_PATH=${MCP_DATABASE_PATH:-/app/data/meds.db}
      - MCP_MAX_QUERY_DAYS=${MCP_MAX_QUERY_DAYS:-90}
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - MCP_ALLOWED_SUBJECT=${MCP_ALLOWED_SUBJECT}
      # APP_DOMAIN is the bot's public origin (with scheme); the MCP server uses
      # it as the CORS Allow-Origin and the trusted origin for the SDK's CSRF
      # protection. Must match the browser's Origin header exactly. Required for
      # the browser-side ElevenLabs client-tool callback path.
      - APP_DOMAIN=https://${DOMAIN}
      - ALLOWED_USER_ID=${ALLOWED_USER_ID}
      - MCP_AUDIT_ENDPOINT=${MCP_AUDIT_ENDPOINT:-http://medtracker:8080/api/mcp-audit}
      - MCP_AUDIT_SECRET=${MCP_AUDIT_SECRET}
      # Executor (Python sandbox) caps. The MCP server enforces these
      # before forwarding to the runner; defaults match docs/mcp-python-executor.md.
      - MCP_EXECUTOR_MAX_TIMEOUT_MS=${MCP_EXECUTOR_MAX_TIMEOUT_MS:-30000}
      - MCP_EXECUTOR_MAX_API_CALLS=${MCP_EXECUTOR_MAX_API_CALLS:-100}
      - MCP_EXECUTOR_MAX_CONCURRENT=${MCP_EXECUTOR_MAX_CONCURRENT:-4}
      # Explicit opt-in for the Python executor. Leave unset to disable
      # mcp_execute; set to the bot's bridge endpoint (e.g.
      # http://medtracker:8080/internal/mcp/bridge) to enable. See
      # docs/mcp-deployment.md "MVP in-process isolation tradeoff" before
      # turning this on.
      - MCP_EXECUTOR_BRIDGE_URL=${MCP_EXECUTOR_BRIDGE_URL}
      # Set to any non-empty value to expose only mcp_help and mcp_execute,
      # hiding legacy granular tools (fitness, cardio, etc.).
      - NO_LEGACY_MCP=${NO_LEGACY_MCP:-}
      # Loopback proxy URL the runner uses for medtracker.api.call.
      - MCP_EXECUTOR_PROXY_URL=${MCP_EXECUTOR_PROXY_URL:-http://127.0.0.1:8090/call}
      # Pocket-ID
      - POCKET_ID_URL=${POCKET_ID_URL}
      - POCKET_ID_CLIENT_ID=${POCKET_ID_CLIENT_ID}
      - POCKET_ID_CLIENT_SECRET=${POCKET_ID_CLIENT_SECRET}
      - POCKET_ID_JWKS_JSON=${POCKET_ID_JWKS_JSON}
      - SKIP_PERMS_FIX=true
      - TZ=${TZ:-Europe/Berlin}
    # Memory and CPU caps mirror the per-run sandbox limits (1 GB / 1 CPU).
    # The MCP container itself stays small; per-run isolation is enforced by
    # the executor service.
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - default
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK_NAME}"
      - "traefik.http.routers.medtracker-mcp-${INSTANCE}.rule=Host(`${MCP_DOMAIN}`)"
      - "traefik.http.routers.medtracker-mcp-${INSTANCE}.entrypoints=websecure"
      - "traefik.http.routers.medtracker-mcp-${INSTANCE}.tls.certresolver=myresolver"
      - "traefik.http.services.medtracker-mcp-${INSTANCE}.loadbalancer.server.port=${MCP_PORT:-8081}"

  # Side container that hosts the Python sandbox runtime. The MCP server's
  # execution service spawns scripts using the runner image; this service
  # exists to vendor the image build/pin and keep the runner toolchain on a
  # network that can ONLY reach the medtracker backend bridge (no Internet).
  #
  # The MVP wires the executor as an in-process spawner inside `mcp-server`
  # (see internal/mcp/executor/service.go), so `mcp-runner` ships with
  # `profiles: ["build-only"]` — `docker compose up` does NOT start it.
  # `docker compose --profile build-only build mcp-runner` builds and pins
  # the image for future side-container use; flip the profile when the
  # executor switches to spawning the standalone container.
  #
  # Hardening assumptions for production deploys (do not relax without
  # updating docs/mcp-python-executor.md):
  #   - read_only: true                    -> root FS is read-only; scripts can only write to /tmp tmpfs
  #   - cap_drop: [ALL]                    -> no Linux capabilities; the runner needs none
  #   - no-new-privileges:true             -> setuid binaries cannot escalate
  #   - tmpfs /tmp                         -> bounded scratch, gone on container restart
  #   - networks: [runner_net]             -> internal: true, no Internet egress
  #   - no Docker socket bind mount        -> scripts cannot spawn containers
  #   - no environment secrets             -> proxy URL + run token are the only knobs
  mcp-runner:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    image: ghcr.io/korjavin/medicationtrackerbot-runner:latest
    container_name: medtracker-mcp-runner-${INSTANCE}
    restart: "no"
    profiles: ["build-only"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      # runner_net is internal-only: no egress to the public Internet.
      - runner_net

  # Local Telegram Bot API Server - removes 20MB file download limit
  telegram-bot-api:
    image: ghcr.io/korjavin/telegram-bot-api:2026-02-28
    pull_policy: if_not_present
    container_name: medtracker-telegram-api-${INSTANCE}
    restart: unless-stopped
    user: "0:0"
    # Default entrypoint forces user 101. We override it to run our own setup.
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Create appuser (1000) manually by modifying /etc/passwd if not exists
        # This avoids dependency on adduser/useradd which are missing in minimal images
        grep -q :1000: /etc/group || echo "appgroup:x:1000:" >> /etc/group
        grep -q :1000: /etc/passwd || echo "appuser:x:1000:1000:appuser:/var/lib/telegram-bot-api:/bin/sh" >> /etc/passwd
        
        # Fix permissions so appuser can write
        mkdir -p /var/lib/telegram-bot-api/data
        chown -R 1000:1000 /var/lib/telegram-bot-api
        
        # Run server, telling it to switch to our new user
        # We start as root, let the binary drop privileges to appuser (1000)
        exec telegram-bot-api --local \
          --api-id=$${TELEGRAM_API_ID} \
          --api-hash=$${TELEGRAM_API_HASH} \
          --dir=/var/lib/telegram-bot-api/data \
          --temp-dir=/tmp \
          --username=appuser \
          --groupname=appgroup \
          --http-port=8081
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1

    ports:
      - "${TGPORT:-8082}:8081"
    networks:
      - default
      - traefik_net

  # Litestream - SQLite replication to Cloudflare R2
  litestream:
    image: ghcr.io/korjavin/litestream:0.3.13
    pull_policy: if_not_present
    container_name: medtracker-litestream-${INSTANCE}
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat << EOF > /tmp/litestream.yml
        retention:
          enabled: $${LITESTREAM_RETENTION_ENABLED:-false}
        levels:
          - interval: $${LITESTREAM_LEVEL_1_INTERVAL:-4h}
          - interval: $${LITESTREAM_LEVEL_2_INTERVAL:-24h}
          - interval: $${LITESTREAM_LEVEL_3_INTERVAL:-168h}
        snapshot:
          interval: $${LITESTREAM_SNAPSHOT_INTERVAL:-240h}
          retention: $${LITESTREAM_RETENTION:-1680h}
        l0-retention: $${LITESTREAM_L0_RETENTION:-24h}
        l0-retention-check-interval: $${LITESTREAM_L0_RETENTION_CHECK_INTERVAL:-24h}
        dbs:
          - path: /app/data/meds.db
            replica:
              type: s3
              bucket: $${R2_BUCKET}
              path: medtracker
              endpoint: $${R2_ENDPOINT}
              sync-interval: $${LITESTREAM_SYNC_INTERVAL:-10h}
        EOF
        exec litestream replicate -config /tmp/litestream.yml
    volumes:
      - medtracker_data:/app/data
    environment:
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
      - LITESTREAM_SYNC_INTERVAL=${LITESTREAM_SYNC_INTERVAL:-10h}
      - LITESTREAM_SNAPSHOT_INTERVAL=${LITESTREAM_SNAPSHOT_INTERVAL:-240h}
      - LITESTREAM_RETENTION=${LITESTREAM_RETENTION:-1680h}
      - LITESTREAM_RETENTION_ENABLED=${LITESTREAM_RETENTION_ENABLED:-false}
      - LITESTREAM_LEVEL_1_INTERVAL=${LITESTREAM_LEVEL_1_INTERVAL:-4h}
      - LITESTREAM_LEVEL_2_INTERVAL=${LITESTREAM_LEVEL_2_INTERVAL:-24h}
      - LITESTREAM_LEVEL_3_INTERVAL=${LITESTREAM_LEVEL_3_INTERVAL:-168h}
      - LITESTREAM_L0_RETENTION=${LITESTREAM_L0_RETENTION:-24h}
      - LITESTREAM_L0_RETENTION_CHECK_INTERVAL=${LITESTREAM_L0_RETENTION_CHECK_INTERVAL:-24h}
    depends_on:
      - medtracker

networks:
  traefik_net:
    external: true
    name: ${NETWORK_NAME}
  # Internal-only network for the runner sandbox. No external connectivity;
  # the runner reaches the MCP server's loopback proxy URL only via the
  # default network when explicitly attached to it.
  runner_net:
    driver: bridge
    internal: true

volumes:
  medtracker_data:
  telegram_bot_api_data:

version: "2"
run:
  concurrency: 4
linters:
  enable:
    - errorlint
    - nolintlint
    - govet
    - staticcheck
    - ineffassign
    - unused
  disable:
    - errcheck
    - gosec
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gosec:
      severity: medium
      confidence: low
  exclusions:
    rules:
      - linters:
          - errorlint
          - gosec
        path: _test\.go$
      - linters:
          - gosec
        path: ^internal/store/migrations/.*\.go$
      - linters:
          - gosec
        text: G703
      - linters:
          - gosec
        text: G704
      - linters:
          - gosec
        text: G705
      - linters:
          - gosec
        text: G706
      - linters:
          - staticcheck
        text: QF1012
      - linters:
          - staticcheck
        text: SA9003
      - linters:
          - staticcheck
        text: SA1019

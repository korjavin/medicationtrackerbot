name: Secrets File Permissions Audit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  file-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build test utility
        run: |
          go build -o /tmp/testinstallerperms ./cmd/testinstallerperms

      - name: Generate sample configuration files
        run: |
          mkdir -p /tmp/test-install
          /tmp/testinstallerperms -output /tmp/test-install

      - name: Audit file permissions
        id: audit
        run: |
          echo "Checking file permissions for secrets..."

          files_to_check=(".env" ".env.mcp" "docker-compose.yml")
          failed=0

          for file in "${files_to_check[@]}"; do
            filepath="/tmp/test-install/$file"
            if [ -f "$filepath" ]; then
              perms=$(stat -c %a "$filepath")
              echo "File: $file - Permissions: $perms"

              # Convert octal permissions to decimal to check for world-readable bit (others: read = bit 2)
              # We need to ensure the last digit (others permissions) doesn't have read (4) or write (2) or execute (1)
              # Acceptable: 0600, 0640, 0640, 0644 is NOT acceptable
              # Check if others have any permissions at all
              others_perm=$((perms % 8))

              if [ $others_perm -ne 0 ]; then
                echo "❌ FAIL: $file has world-readable/writable permissions ($perms)"
                echo "   Others permissions: $others_perm (should be 0 for secrets)"
                failed=1
              else
                echo "✅ PASS: $file has secure permissions ($perms)"
              fi
            else
              echo "⚠️  WARN: $file not found (may be optional)"
            fi
          done

          if [ $failed -eq 1 ]; then
            exit 1
          fi

      - name: Report results (summary)
        if: always()
        run: |
          echo "## 🔐 Secrets File Permissions Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Checked" >> $GITHUB_STEP_SUMMARY
          echo "- \`.env\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`.env.mcp\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`docker-compose.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Requirements" >> $GITHUB_STEP_SUMMARY
          echo "Files containing secrets must NOT be world-readable." >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Acceptable: 0600, 0640 (others: 0)" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Vulnerable: 0644, 0664 (others: 4 = read-only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "**Result**: All secrets files have secure permissions ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result**: Some files have insecure permissions ❌" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const jobStatus = '${{ job.status }}';
            const icon = jobStatus === 'success' ? '✅' : '❌';

            const comment = `## ${icon} Secrets File Permissions Audit

### Security Check
This check verifies that configuration files containing secrets are NOT world-readable.

**Files Audited**:
- \`.env\` (contains TELEGRAM_BOT_TOKEN, OIDC_CLIENT_SECRET, VAPID_PRIVATE_KEY)
- \`.env.mcp\` (contains client secrets)
- \`docker-compose.yml\` (may reference secrets)

**Vulnerability Prevention**:
Prevents privilege escalation attacks where unprivileged processes can steal secrets from world-readable files.

**Status**: ${jobStatus === 'success' ? 'All files have secure permissions (0600/0640 max)' : 'Some files have world-readable permissions (0644/0664) ❌'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

name: MCP helper release

on:
  pull_request:
    paths:
      - 'cmd/mcpshim/**'
      - 'internal/mcpshim/**'
      - 'internal/cloudserver/mcp_shim_integration_test.go'
      - 'scripts/*mcpshim*'
      - '.github/workflows/release-mcpshim.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    tags: ['mcpshim-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcpshim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=0.1.0
          if [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = mcpshim-v0.1.0 ] || { echo 'Only the reviewed first helper release is supported'; exit 1; }
            git fetch origin master
            git merge-base --is-ancestor HEAD origin/master
            # An existing tag is the trigger; existing releases/assets are never overwritten.
            if gh release view "$REF_NAME" >/dev/null 2>&1; then echo 'Release already exists; refusing overwrite'; exit 1; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build raw pinned helper
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.source.outputs.version }}
          COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -eu
          [ "$(go env GOVERSION)" = go1.26.5 ]
          asset="mcpshim_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then asset="$asset.exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION -X main.commit=$COMMIT" -o "dist/$asset" ./cmd/mcpshim
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  native:
    needs: [source, build]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: raw-*
          merge-multiple: true
          path: dist
      - name: Native packaged executable and installer smoke
        shell: bash
        env:
          VERSION: ${{ needs.source.outputs.version }}
          MEDTRACKER_PACKAGED_SHIM_TEST_VERSION: ${{ needs.source.outputs.version }}+${{ needs.source.outputs.commit }}
        run: |
          set -eu
          system=$(go env GOOS)
          arch=$(go env GOARCH)
          asset="mcpshim_${VERSION}_${system}_${arch}"
          if [ "$system" = windows ]; then asset="$asset.exe"; else chmod 700 "dist/$asset"; fi
          echo "Actually executing $system/$arch: $asset"
          export MEDTRACKER_PACKAGED_SHIM_TEST_BINARY="$PWD/dist/$asset"
          if [ "$system" = windows ]; then MEDTRACKER_PACKAGED_SHIM_TEST_BINARY=$(cygpath -w "$MEDTRACKER_PACKAGED_SHIM_TEST_BINARY"); export MEDTRACKER_PACKAGED_SHIM_TEST_BINARY; fi
          go test ./internal/mcpshim -run '^TestInstallers$|^TestPackagedInstallCommands$' -count=1
          go test ./internal/cloudserver -run '^TestMCPShim_PackagedProcess$' -count=1 -timeout 3m
      - name: Install pinned Claude CLI on clean Linux runner
        if: runner.os == 'Linux'
        run: npm install --global @anthropic-ai/claude-code@2.1.314
      - name: Actual Claude parser and conflict proof in ephemeral runner
        if: runner.os == 'Linux'
        env:
          MCP_CLAUDE_EPHEMERAL_RUNNER: '1'
        run: go test ./internal/mcpshim -run '^TestInstallerInstalledClaudeIsolated$' -count=1 -v
  package:
    needs: [source, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: raw-*
          merge-multiple: true
          path: dist
      - name: Assemble exact checksums and command bytes
        env:
          VERSION: ${{ needs.source.outputs.version }}
          COMMIT: ${{ needs.source.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/package-mcpshim.py dist --version "$VERSION" --commit "$COMMIT" --run-url "$RUN_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcpshim-release-contract
          path: dist/*
          if-no-files-found: error
  attest:
    if: github.ref_type == 'tag'
    needs: [source, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcpshim-release-contract
          path: dist
      - name: Attest exact finalized release bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
  publish:
    if: github.ref_type == 'tag'
    needs: [source, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcpshim-release-contract
          path: dist
      - name: Publish once without changing the latest product release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then echo 'Release already exists; refusing overwrite'; exit 1; fi
          gh release create "$TAG" --verify-tag --target "$COMMIT" --draft --latest=false --title "$TAG" --notes 'Pinned private MCP helper. See provenance.json, SHA256SUMS, commands.json and docs/mcpshim.md. Six cross-builds; actual native executions are recorded in the workflow run.' dist/*
          gh release edit "$TAG" --draft=false --latest=false

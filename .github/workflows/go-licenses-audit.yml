name: Go Licenses Audit

on:
  pull_request:
    branches:
      - master
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-licenses-audit.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Cache go-licenses binary
        id: cache-go-licenses
        uses: actions/cache@v4
        with:
          path: ~/go/bin/go-licenses
          key: go-licenses-${{ runner.os }}-v1.6.0

      - name: Install go-licenses
        if: steps.cache-go-licenses.outputs.cache-hit != 'true'
        run: go install github.com/google/go-licenses@v1.6.0

      - name: Generate license report
        id: license-scan
        run: |
          go-licenses csv github.com/korjavin/medicationtrackerbot/cmd/bot > licenses-report.csv 2>&1 || true
          cat licenses-report.csv

      - name: Validate licenses
        run: |
          python3 << 'EOF'
          import csv
          import sys

          # Blocked license patterns (GPL/AGPL/copyleft)
          BLOCKED_LICENSES = {
              'GPL',
              'AGPL',
              'GNU General Public License',
              'GNU Affero General Public License',
              'Copyleft',
          }

          # Allowed licenses (permissive/business-friendly)
          ALLOWED_LICENSES = {
              'MIT',
              'Apache',
              'Apache License',
              'Apache Software License',
              'BSD',
              'BSD-2-Clause',
              'BSD-3-Clause',
              'ISC',
              'MPL',
              'Mozilla Public License',
              'Python Software Foundation',
              'Unicode',
              'Unlicense',
              'WTFPL',
          }

          # Undeclared/Unknown licenses (requires approval)
          UNDECLARED = {'Unknown', 'NOASSERTION', ''}

          blocked = []
          undeclared = []
          allowed = []

          try:
              with open('licenses-report.csv', 'r') as f:
                  # go-licenses csv outputs headerless rows: name,url,license_spdx
                  reader = csv.reader(f)
                  rows = list(reader)

                  if not rows:
                      print("Warning: Empty licenses report")
                      sys.exit(0)

                  for row in rows:
                      if len(row) < 3:
                          continue
                      package = row[0]
                      license_name = row[2].strip()

                      # Check if license is blocked
                      is_blocked = any(b in license_name for b in BLOCKED_LICENSES)
                      is_allowed = any(a in license_name for a in ALLOWED_LICENSES)
                      is_undeclared = license_name in UNDECLARED or not license_name

                      if is_blocked:
                          blocked.append((package, license_name))
                      elif is_undeclared:
                          undeclared.append((package, license_name))
                      elif is_allowed:
                          allowed.append((package, license_name))
                      else:
                          # Unknown license - treat as undeclared
                          undeclared.append((package, license_name))

          except FileNotFoundError:
              print("Error: licenses-report.csv not found")
              sys.exit(1)
          except Exception as e:
              print(f"Error parsing licenses: {e}")
              sys.exit(1)

          # Report
          print("\n" + "="*80)
          print("LICENSE COMPLIANCE REPORT")
          print("="*80)

          if blocked:
              print(f"\n❌ BLOCKED LICENSES ({len(blocked)}):")
              for pkg, lic in blocked:
                  print(f"  - {pkg}: {lic}")

          if undeclared:
              print(f"\n⚠️  UNDECLARED/UNKNOWN LICENSES ({len(undeclared)}):")
              for pkg, lic in undeclared:
                  print(f"  - {pkg}: {lic or 'No license declared'}")

          print(f"\n✅ ALLOWED LICENSES ({len(allowed)}):")
          for pkg, lic in allowed[:10]:  # Show first 10
              print(f"  - {pkg}: {lic}")
          if len(allowed) > 10:
              print(f"  ... and {len(allowed) - 10} more")

          print("\n" + "="*80)

          # Fail if blocked licenses found; warn but pass for undeclared
          if blocked:
              print(f"\n❌ FAILED: Found {len(blocked)} blocked license(s)")
              print("\nTo resolve:")
              print("1. Remove packages with GPL/AGPL/copyleft licenses")
              sys.exit(1)
          else:
              if undeclared:
                  print(f"\n⚠️  WARNING: Found {len(undeclared)} undeclared/unknown license(s)")
                  print("Consider reviewing these packages manually.")
              print("\n✅ No blocked licenses found!")
              sys.exit(0)
          EOF

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licenses-report
          path: licenses-report.csv
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');

            const BLOCKED_LICENSES = ['GPL', 'AGPL', 'GNU General Public License', 'GNU Affero General Public License', 'Copyleft'];

            let blockedPkgs = [];
            try {
              const csv = fs.readFileSync('licenses-report.csv', 'utf8');
              for (const line of csv.trim().split('\n')) {
                const parts = line.split(',');
                if (parts.length >= 3) {
                  const licenseName = parts[2].trim();
                  if (BLOCKED_LICENSES.some(b => licenseName.includes(b))) {
                    blockedPkgs.push({ pkg: parts[0], license: licenseName });
                  }
                }
              }
            } catch (e) {
              // If we can't read the report, skip commenting
            }

            if (blockedPkgs.length > 0) {
              let report = '## 📜 License Compliance Audit\n\n';
              report += `❌ **${blockedPkgs.length} blocked license(s) found**\n\n`;
              for (const { pkg, license } of blockedPkgs) {
                report += `- **${pkg}**: ${license}\n`;
              }
              report += '\nGPL/AGPL/Copyleft licenses are not allowed. Please replace these dependencies.\n';

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }

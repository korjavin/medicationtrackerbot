name: golangci-lint

on:
  push:
    branches:
      - master
      - fe-stage2
  pull_request:
    branches:
      - master
      - fe-stage2

permissions:
  contents: read
  security-events: write

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
          args: --timeout=5m --output.text.path=stdout --output.sarif.path=golangci-lint-result.sarif
          skip-cache: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: golangci-lint-result.sarif
          category: golangci-lint
        if: always()
        continue-on-error: true

name: Secrets Scanning (TruffleHog)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail

      - name: Scan with TruffleHog filesystem mode (detailed)
        id: trufflehog-scan
        run: |
          # Install TruffleHog
          pip install truffleHog==3.63.0

          # Run TruffleHog filesystem scan
          truffleHog filesystem . \
            --only-verified \
            --json \
            --fail \
            -v \
            2>&1 | tee truffleHog-results.json || SCAN_EXIT=$?

          echo "SCAN_EXIT=${SCAN_EXIT:-0}" >> $GITHUB_ENV
        continue-on-error: true

      - name: Parse and report secrets findings
        if: always()
        run: |
          if [ -f truffleHog-results.json ]; then
            python3 << 'EOF'
            import json
            import sys

            try:
              with open('truffleHog-results.json', 'r') as f:
                lines = f.readlines()
            except FileNotFoundError:
              print("No secrets scan results found")
              sys.exit(0)

            findings = []
            for line in lines:
              if line.strip() and not line.startswith("Running") and not line.startswith("Finished"):
                try:
                  findings.append(json.loads(line))
                except json.JSONDecodeError:
                  pass

            if findings:
              print(f"\n❌ Found {len(findings)} potential secret(s):")
              for finding in findings:
                if 'raw_v2' in finding:
                  print(f"\n  📍 Finding: {finding.get('detector_name', 'Unknown')}")
                  print(f"     Type: {finding.get('type', 'Unknown')}")
                  if 'file_path' in finding:
                    print(f"     File: {finding['file_path']}")
                  if 'line_number' in finding:
                    print(f"     Line: {finding['line_number']}")
            else:
              print("✅ No secrets detected in verified scan")
            EOF
          fi

      - name: Fail if secrets detected
        if: env.SCAN_EXIT != '0' && env.SCAN_EXIT != ''
        run: |
          echo "❌ Secret scanning failed - potential secrets detected"
          echo "Please review the results above and:"
          echo "1. Remove any exposed credentials from the repository"
          echo "2. Rotate exposed API keys, tokens, and secrets immediately"
          echo "3. Use environment variables or GitHub Secrets for sensitive data"
          exit 1

      - name: Comment on PR with scan results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            let comment = '## 🔐 Secrets Scanning Results\n\n';

            const fs = require('fs');
            let hasSecrets = false;

            if (fs.existsSync('truffleHog-results.json')) {
              const content = fs.readFileSync('truffleHog-results.json', 'utf8');
              const lines = content.split('\n').filter(l => l.trim());
              const findings = [];

              for (const line of lines) {
                if (line.startsWith('{')) {
                  try {
                    findings.push(JSON.parse(line));
                    hasSecrets = true;
                  } catch (e) {}
                }
              }

              if (hasSecrets) {
                comment += `⚠️ **${findings.length} potential secret(s) detected**\n\n`;
                comment += 'This PR contains potential hardcoded secrets:\n';
                for (const finding of findings) {
                  comment += `- **${finding.detector_name}** in \`${finding.file_path || 'unknown'}\`\n`;
                }
                comment += '\n**Action Required:**\n';
                comment += '1. Remove exposed credentials from this PR\n';
                comment += '2. Rotate any exposed API keys, tokens, and secrets\n';
                comment += '3. Use environment variables or GitHub Secrets instead\n';
              }
            }

            if (!hasSecrets) {
              comment += '✅ No secrets detected in this PR';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

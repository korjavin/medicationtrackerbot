name: iOS visual (web)

# Tier 1 of docs/design/ios-visual-testing.md, on Linux:
#   local: the QA=1 local bundle in Playwright WebKit at 390 and 440pt iPhone
#          widths, plus Chromium at desktop 1280x800 and Pixel 7.
#   cloud: the real cmd/cloud on *.localhost, an account signed up through the
#          real wizard with Chromium's virtual PRF authenticator, the golden
#          vault imported through Settings → Backup, the same scenes from the
#          account app (cloud apishim, server CSP), desktop + Pixel 7.
#   flows: tests/visual/playwright/flows.mjs, the asserting flows on the real
#          cmd/cloud (one and two devices), a gate.
# Two triggers, both also on PR label `ios-visual` or a manual dispatch:
#   local, cloud: any PR touching shared web CSS / components / the cloud shell.
#   flows: any PR touching web/, the cloud server or store, cmd/cloud, the Go
#          module, tests/visual or this file — every path the account app and
#          its server read, so no nightly (bd med-sz4k.2.4).
#
# The screenshot jobs are evidence, not a gate: probe failures become warnings;
# a job fails only when it produced no screenshot. Linux WebKit is not
# WKWebView: no focus-zoom, no software keyboard or visualViewport shrink, no
# safe-area insets or shell bands, different fonts. It catches overflow, clipping, chart widths and
# stacking; it would not have caught med-pe9g. Never diff its PNGs against the
# Simulator tier's.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      flows: ${{ steps.check.outputs.flows }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: check
        env:
          LABELED: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ios-visual') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$LABELED" = true ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            echo flows=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          if grep -qE '^(web/static/css/|web/static/js/components/|web/cloud/|tests/visual/|\.github/workflows/visual-web\.yml$)' <<< "$changed"; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(web/|internal/cloudserver/|internal/cloudstore/|cmd/cloud/|go\.(mod|sum)$|tests/visual/|\.github/workflows/visual-web\.yml$)' <<< "$changed"; then
            echo flows=true >> "$GITHUB_OUTPUT"
          else
            echo flows=false >> "$GITHUB_OUTPUT"
          fi

  local:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same Playwright as e2e/ (1.56.0); the image carries WebKit, Chromium and their deps.
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    defaults:
      run:
        shell: bash # container steps default to sh
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the QA local app
        run: QA=1 ios/bundle-web.sh "visual-${GITHUB_SHA::7}"

      - name: Install Playwright
        working-directory: tests/visual/playwright
        run: npm install --no-audit --no-fund

      - name: Screenshot the scenes
        env:
          HOME: /root # Playwright CI docs: browsers misbehave under the runner's /github/home
        run: node tests/visual/playwright/run.mjs visual-web

      - name: Job summary
        if: always()
        run: cat visual-web/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no summary" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-visual-web
          path: visual-web
          retention-days: 30
          if-no-files-found: warn

  # bd med-y5xx.4: the local tier's shots against master's latest
  # ios-visual-web artifact (a dispatch on master). Its own job on the runner
  # image, which has gh; the Playwright container does not. Evidence only.
  compare:
    needs: local
    if: ${{ !cancelled() && needs.local.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-visual-web
          path: visual-web

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Compare with master
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/visual/compare.sh ios-visual-web visual-web visual-web-compare || true

      - uses: actions/upload-artifact@v4
        with:
          name: ios-visual-web-compare
          path: visual-web-compare
          retention-days: 30
          if-no-files-found: warn

  cloud:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build cmd/cloud
        run: CGO_ENABLED=0 go build -buildvcs=false -o /tmp/cloud ./cmd/cloud

      - name: Install Playwright
        working-directory: tests/visual/playwright
        run: npm install --no-audit --no-fund

      - name: Sign up, import, screenshot the scenes
        env:
          HOME: /root
          CLOUD_BIN: /tmp/cloud
        run: node tests/visual/playwright/run.mjs visual-web-cloud cloud

      - name: Job summary
        if: always()
        run: cat visual-web-cloud/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no summary" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-web-cloud
          path: visual-web-cloud
          retention-days: 30
          if-no-files-found: warn

  # bd med-sz4k.2.2 / .2.3: offline-cold-open, app-update-banner,
  # boot-degraded-reload (one device, the real service worker over two stamped
  # builds), eu-register-check and pull-to-refresh (two devices on one
  # account). A gate, unlike the screenshots: a failed assertion fails the job.
  # Its own wider trigger (bd med-sz4k.2.4), see the header.
  flows:
    needs: gate
    if: needs.gate.outputs.flows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Playwright
        working-directory: tests/visual/playwright
        run: npm install --no-audit --no-fund

      - name: Flows
        env:
          HOME: /root
        run: node tests/visual/playwright/flows.mjs visual-web-flows

      - name: Job summary
        if: always()
        run: cat visual-web-flows/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no flows summary" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-web-flows
          path: visual-web-flows
          retention-days: 30
          if-no-files-found: warn

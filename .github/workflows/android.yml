name: Android

# No local Android builds (epic med-nt9p): every build, signing and Play upload
# runs here. Runs ONLY on android/, this file, or the web app the APK bundles for
# local mode (bd med-nt9p.32.2), or by hand. See docs/android.md. Releases are
# dispatch-only, so a web push builds and tests the APK and nothing more.
# deploy.yml ignores android/** and this file, so Android-only merges never redeploy.
on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'ios/LocalSpike/**' # the debug APK's local-mode spike page (bd med-nt9p.32.1)
      - 'ios/bundle-web.sh' # local mode's bundle, assets/web (bd med-nt9p.32.2)
      - 'web/static/**'
      - 'web/cloud/**'
      - 'web/domain/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - 'ios/LocalSpike/**'
      - 'ios/bundle-web.sh'
      - 'web/static/**'
      - 'web/cloud/**'
      - 'web/domain/**'
      - '.github/workflows/android.yml'
  # Any branch: spike branches ship to Play internal testing from here.
  workflow_dispatch:
    inputs:
      release_status:
        description: "Play release status (draft until the app's first review clears)"
        type: choice
        options: [completed, draft]
        default: completed
      publish_apk_release:
        description: "Also publish the upload-key-signed APK as a GitHub pre-release (friends' sideload link)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are superseded; a push must never cancel an in-flight release dispatch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sign: ${{ steps.release.outputs.sign }}
    env:
      # The package is public once on Play, so it may show in these (public)
      # logs. The base domain must not: only the first step below reads it, from
      # a secret, and re-exports it masked.
      # Release secrets are NOT job-level: only the dispatch-gated steps get them.
      ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      # The shell's base domain (BuildConfig.BASE_DOMAIN, app/build.gradle.kts).
      # A SECRET, not the CLOUD_BASE_DOMAIN variable deploy.yml/ios.yml read: a
      # step's env block is printed before its script runs, so a variable's
      # value would show in this header; a secret is masked from the start.
      # Every later step header shows it as ***. Unset (forks, before owner
      # setup): the app builds, and its first run says no service is configured.
      - name: Mask base domain
        env:
          D: ${{ secrets.CLOUD_BASE_DOMAIN }}
        run: |
          if [ -z "$D" ]; then
            echo "::notice::CLOUD_BASE_DOMAIN secret unset — the app's first run will say no service is configured (see docs/android.md)"
            exit 0
          fi
          echo "::add-mask::$D"
          echo "CLOUD_BASE_DOMAIN=$D" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No committed wrapper: nothing is built locally, so the runner's pinned
      # Gradle is the only one that ever runs.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.11.1'

      # A stable debug key keeps the debug APK's certificate — and so its
      # asset-links fingerprint in ANDROID_CERT_SHA256S — the same on every run.
      # Without it (PRs, before owner setup) Gradle mints a throwaway key: the
      # APK still installs, passkeys just won't bind to it. PR code never gets
      # the key: its fingerprint is trusted by the production asset links.
      - name: Install debug keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_DEBUG_KEYSTORE_BASE64 not set — debug APK signed with a per-run key (see docs/android.md)"
            exit 0
          fi
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          echo "ANDROID_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      # Local mode (bd med-nt9p.32.2, docs/android.md → Local mode): the web app from this one
      # checked-out revision into app/src/main/assets/web (git-ignored), before any Gradle task
      # — debug, release and the AAB all carry it. iOS's script; only its output dir and
      # build-id prefix are overridden.
      - name: Bundle the web app for local mode
        env:
          WG_BUNDLE_OUT: android/app/src/main/assets/web
          WG_BUNDLE_PREFIX: android
        run: ios/bundle-web.sh "${{ github.run_number }}"

      - name: Build debug APK and run unit tests
        working-directory: android
        run: gradle --no-daemon assembleDebug testDebugUnitTest

      # The bundle reached the APK (it is never committed: only the step above makes it), its
      # document loads the local entry, and no QA driver or test suite came along.
      - name: Check local-mode bundle in the debug APK
        run: |
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          list=$(unzip -l "$apk")
          for f in assets/web/index.html assets/web/cloud/js/local-boot.js assets/web/cloud/js/apishim.js assets/web/domain/bp.js assets/web/static/js/core/utils.js; do
            grep -q " $f\$" <<<"$list" || { echo "::error::$f missing from $apk"; exit 1; }
          done
          if grep -qE ' assets/web/(cloud/qa/|static/js/tests/|cloud/js/tests/)' <<<"$list"; then
            echo "::error::QA driver or test suites in the bundle"; exit 1
          fi
          doc=$(unzip -p "$apk" assets/web/index.html)
          grep -q 'src="/js/local-boot.js"' <<<"$doc" || { echo "::error::local index.html lacks local-boot.js"; exit 1; }
          if grep -q 'cloud-boot.js' <<<"$doc"; then echo "::error::local index.html loads cloud-boot.js"; exit 1; fi
          echo "local bundle: $(grep -c ' assets/web/' <<<"$list") files"

      # Proves the APK is signed by the secret's key. Prints MATCH/MISMATCH only.
      - name: Verify debug APK signing key
        if: env.ANDROID_DEBUG_KEYSTORE != ''
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          want=$(keytool -list -v -keystore "$ANDROID_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-F' 'a-f')
          got=$("$apksigner" verify --print-certs android/app/build/outputs/apk/debug/*.apk | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1 | tr 'A-F' 'a-f')
          echo "digest lengths: keystore=${#want} apk=${#got}"
          if [ -n "$want" ] && [ "$want" = "$got" ]; then
            echo "Debug APK signing key: MATCH"
          else
            echo "::error::Debug APK signing key: MISMATCH"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medtracker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Release only on a manual dispatch, and only once its inputs exist —
      # until the owner adds them, the run stays green on the build above.
      # Signing needs the keystore; the Play upload also needs the service
      # account, so the first AAB (uploaded by hand in Play Console) can be
      # built before the API access exists.
      - name: Check release inputs
        id: release
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for v in ANDROID_PACKAGE ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Release AAB and Play upload skipped — missing:$missing (see docs/android.md)"
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          if [ -z "$ANDROID_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Play upload skipped — missing: ANDROID_PLAY_SERVICE_ACCOUNT_JSON (the signed AAB is still a run artifact; see docs/android.md)"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release AAB
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.sign == 'true'
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          export ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_UPLOAD_KEYSTORE"
          trap 'rm -f "$ANDROID_UPLOAD_KEYSTORE"' EXIT
          gradle --no-daemon bundleRelease assembleRelease

      # bd med-nt9p.32.6: the QA driver (QA=1, android-qa.yml only) never reaches a shipped build.
      - name: Release APK and AAB carry no QA driver
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.sign == 'true'
        run: |
          for f in android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/bundle/release/app-release.aab; do
            list=$(unzip -l "$f")
            grep -qE ' (base/)?assets/web/index\.html$' <<<"$list" || { echo "::error::no local bundle in $f"; exit 1; }
            if grep -qE ' (base/)?assets/web/cloud/qa/' <<<"$list"; then echo "::error::QA driver in $f"; exit 1; fi
          done

      # Kept for the first, manual Play Console upload of a new app.
      - name: Upload release AAB
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: medtracker-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      # The same release build as an installable APK (signed with the upload
      # key); the optional release job below publishes it for friends.
      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: medtracker-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Play internal testing
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.release_status }}

  # Friends' sideload link. Separate job so only this one gets contents: write,
  # and only on a dispatch that asked for it; PR/push runs never reach it.
  release-apk:
    needs: build
    # !cancelled(): a Play upload failure later in build must not block the sideload link.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish_apk_release && needs.build.outputs.sign == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: medtracker-release-apk
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-v0.1.${{ github.run_number }}
        run: |
          gh release create "$TAG" app-release.apk#medtracker.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Android $TAG (sideload)" \
            --notes "Sideload build, not from Play. Install steps: docs/android.md (Friends: install the APK)."

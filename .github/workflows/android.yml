name: Android

# No local Android builds (epic med-nt9p): every build, signing and Play upload
# runs here. Runs ONLY on android/ or this file, or by hand. See docs/android.md.
# deploy.yml ignores android/** and this file, so Android-only merges never redeploy.
on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  # Any branch: spike branches ship to Play internal testing from here.
  workflow_dispatch:
    inputs:
      release_status:
        description: "Play release status (draft until the app's first review clears)"
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Non-secret config lives in repo variables so the package and domain stay
      # out of this public tree; the build works without them. Release secrets
      # are NOT job-level: only the dispatch-gated steps below get them.
      ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
      CLOUD_BASE_DOMAIN: ${{ vars.CLOUD_BASE_DOMAIN }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Mask deployment config
        run: |
          [ -z "$ANDROID_PACKAGE" ] || echo "::add-mask::${ANDROID_PACKAGE}"
          [ -z "$CLOUD_BASE_DOMAIN" ] || echo "::add-mask::${CLOUD_BASE_DOMAIN}"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No committed wrapper: nothing is built locally, so the runner's pinned
      # Gradle is the only one that ever runs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # A stable debug key keeps the debug APK's certificate — and so its
      # asset-links fingerprint in ANDROID_CERT_SHA256S — the same on every run.
      # Without it (forks, before owner setup) Gradle mints a throwaway key:
      # the APK still installs, passkeys just won't bind to it.
      - name: Install debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_DEBUG_KEYSTORE_BASE64 not set — debug APK signed with a per-run key (see docs/android.md)"
            exit 0
          fi
          mkdir -p "$HOME/.android"
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build debug APK and run unit tests
        working-directory: android
        run: gradle --no-daemon assembleDebug testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medtracker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Play upload only on a manual dispatch, and only once every input
      # exists — until the owner adds them, the run stays green on the build above.
      - name: Check release inputs
        id: release
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for v in ANDROID_PACKAGE CLOUD_BASE_DOMAIN ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD ANDROID_PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Play upload skipped — missing:$missing (see docs/android.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release AAB
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          export ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_UPLOAD_KEYSTORE"
          trap 'rm -f "$ANDROID_UPLOAD_KEYSTORE"' EXIT
          gradle --no-daemon bundleRelease

      - name: Upload to Play internal testing
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.release_status }}

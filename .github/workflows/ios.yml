name: iOS

# macOS minutes cost ~10x Linux and mobile CI was removed once for spend
# (med-2ue): this runs ONLY on ios/, this file, or the web app the build
# bundles for local mode (bd med-o7zq.4), or by hand. See docs/ios.md.
# deploy.yml ignores ios/** and this file, so iOS-only merges never redeploy.
# The `visual` job (Simulator screenshots, bd med-y5xx.3) is opt-in on top:
# PR label `ios-visual`, or a dispatch with visual=true.
on:
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'web/static/**'
      - 'web/cloud/**'
      - 'web/domain/**'
  pull_request:
    branches: [master]
    # labeled: adding `ios-visual` starts the visual job (build skips that event).
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'web/static/**'
      - 'web/cloud/**'
      - 'web/domain/**'
      - 'tests/visual/**'
  # Any branch: spike branches ship to TestFlight from here.
  workflow_dispatch:
    inputs:
      visual:
        description: Simulator screenshots only (skips the build and TestFlight)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Not on a visual-only run: a label event, or a visual dispatch (which
    # must never reach the TestFlight steps).
    if: github.event.action != 'labeled' && !inputs.visual
    # Job-level, so a visual run never cancels a build or a TestFlight dispatch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Non-secret config lives in repo variables so the deployment domain and
      # Apple team stay out of this public tree; the build works without them.
      # Secrets are deliberately NOT job-level: only the dispatch-gated signing
      # steps below get them, so PR-controlled build steps never see them.
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      CLOUD_BASE_DOMAIN: ${{ vars.CLOUD_BASE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      # Before xcodegen: project.yml carries ios/LocalApp as a folder.
      - name: Bundle the web app for local mode
        run: ios/bundle-web.sh "${{ github.run_number }}"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Check first-run link parsing, local-origin routing, the local lock, reminder paths and the diagnostics log
        working-directory: ios
        run: |
          swiftc -D DEBUG App/AccountURL.swift App/LocalOrigin.swift App/LocalLock.swift App/ReminderPath.swift App/Move.swift App/Diag.swift Tests/main.swift -o "$RUNNER_TEMP/accounturl-check"
          "$RUNNER_TEMP/accounturl-check"

      # build-for-testing: the app plus the MedTrackerUITests bundle (bd
      # med-y5xx.2), so the visual-QA target compiles on every iOS PR.
      - name: Build (unsigned, simulator)
        working-directory: ios
        run: |
          xcodebuild build-for-testing -project MedTracker.xcodeproj -scheme MedTracker \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/build.log" | tail -n 50
          status=${PIPESTATUS[0]}
          # The tail cuts the compiler's diagnostics off a failed build.
          grep -E ': error:' "$RUNNER_TEMP/build.log" | sort -u | head -n 40 || true
          test "$status" -eq 0

      # The archive step's "no QA hook" check greps for this marker; prove the
      # Debug build carries it, so that check cannot pass vacuously.
      - name: Check the Debug build carries the visual-QA hook
        working-directory: ios/build/sim/Build/Products/Debug-iphonesimulator/MedTracker.app
        run: |
          grep -qF 'wgapp://local/?qa=' MedTracker MedTracker.debug.dylib 2>/dev/null \
            || { echo "::error::QA hook marker not found in the Debug binary; update the archive check in this file"; exit 1; }

      # Local-mode diagnostic (bd med-o7zq.1): a broken page only shows on the
      # phone, so check the bundle carries it and its scripts parse.
      - name: Check local-mode diagnostic page
        working-directory: ios
        run: |
          test -f build/sim/Build/Products/Debug-iphonesimulator/MedTracker.app/LocalSpike/index.html
          node --check LocalSpike/js/boot.js
          find LocalSpike -name '*.js' ! -name boot.js -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f" || { echo "::error file=ios/$f::syntax error"; exit 1; }
          done

      # The local app's entry points are in the built bundle, and its
      # document loads the local entry, not cloud-boot.js.
      - name: Check local-mode bundle
        working-directory: ios/build/sim/Build/Products/Debug-iphonesimulator/MedTracker.app/LocalApp
        run: |
          for f in index.html cloud/js/apishim.js domain/bp.js static/js/core/utils.js static/vendor/dexie.min.js; do
            test -f "$f" || { echo "::error::LocalApp/$f missing from the app bundle"; exit 1; }
          done
          grep -q 'src="/js/local-boot.js"' index.html
          if grep -q 'cloud-boot.js' index.html; then echo "::error::local index.html loads cloud-boot.js"; exit 1; fi
          test ! -e static/js/tests && test ! -e cloud/js/tests
          # The entry itself comes from bd med-o7zq.2; until it lands local mode
          # (a test-build Settings toggle) boots to a broken page. Make this an error once it has landed.
          test -f cloud/js/local-boot.js || echo "::warning::LocalApp/cloud/js/local-boot.js missing (bd med-o7zq.2 not merged): local mode cannot boot"

      # TestFlight only on a manual dispatch, and only once every signing input
      # exists — until the owner adds them, the run stays green on the build above.
      - name: Check signing inputs
        id: signing
        if: github.event_name == 'workflow_dispatch'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for v in IOS_BUNDLE_ID IOS_TEAM_ID CLOUD_BASE_DOMAIN IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_APPSTORE_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight upload skipped — missing:$missing (see docs/ios.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install signing material
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "::add-mask::${CLOUD_BASE_DOMAIN}"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PW}"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
          # Manual signing with the owner's App Store profile: Xcode never
          # creates certificates or profiles (automatic signing minted an
          # Apple Development cert per ephemeral run, bd med-w6gx.12).
          PROFILE="$RUNNER_TEMP/appstore.mobileprovision"
          echo "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          # Xcode 16+ reads the first directory, older Xcode the second.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          rm "$PROFILE" "$RUNNER_TEMP/profile.plist"
          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # The archive gets no Apple account at all, so it cannot create a
          # certificate or profile; it signs with the imported identity only.
          xcodebuild archive -project MedTracker.xcodeproj -scheme MedTracker \
            -destination 'generic/platform=iOS' -archivePath build/MedTracker.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            WG_BASE_DOMAIN="${CLOUD_BASE_DOMAIN}" | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0
          # App Attest (bd med-o7zq.16): the signed app must carry it, or the
          # anonymous trial fails on device only.
          codesign -d --entitlements - --xml build/MedTracker.xcarchive/Products/Applications/MedTracker.app \
            | grep -q 'com.apple.developer.devicecheck.appattest-environment' \
            || { echo "::error::the signed app lacks the App Attest entitlement (App ID capability / profile)"; exit 1; }
          echo "App Attest entitlement present"
          # The visual-QA hook (bd med-y5xx.2) is #if DEBUG: the Release archive must not carry it.
          # Same marker the build job finds in the Debug binary.
          if grep -qF 'wgapp://local/?qa=' build/MedTracker.xcarchive/Products/Applications/MedTracker.app/MedTracker; then
            echo "::error::the archive carries the Debug-only -wgQAScene hook"; exit 1
          fi
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $IOS_PROFILE_UUID" "$OPTS"
          # The API key is only for the upload: export is manual-signed
          # (ExportOptions.plist), so the account is never asked for signing assets.
          xcodebuild -exportArchive -archivePath build/MedTracker.xcarchive \
            -exportOptionsPlist "$OPTS" -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0

      - name: Clean up signing material
        if: always() && github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/asc_key.p8"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision" \
                "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"

  # Visual QA on the Simulator (bd med-y5xx.3, docs/design/ios-visual-testing.md):
  # every scene of tests/visual/scenes.json on a 390pt and a 440pt iPhone, as
  # the `ios-visual` artifact. Evidence, not a gate: scene and probe failures
  # are warnings; a device job fails only when its device produced no screenshots.
  # One device per job (bd med-y5xx.12): booting both in one job is serial,
  # and overlapping boots starved the scenes; `visual-merge` joins them.
  visual:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.visual) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ios-visual') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ios-visual'))
    strategy:
      # One device's failure must not cancel the other's shots.
      fail-fast: false
      matrix:
        include:
          # First available type per width.
          - width: 390
            types: iPhone 16e,iPhone 16,iPhone 15
          - width: 440
            types: iPhone 17 Pro Max,iPhone 16 Pro Max
    # Per device: one shared group would make the two matrix jobs cancel each other.
    concurrency:
      group: ${{ github.workflow }}-visual-${{ github.ref }}-${{ matrix.width }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the web app with the QA driver
        run: QA=1 ios/bundle-web.sh "${{ github.run_number }}"

      - name: Generate Xcode project and build for testing
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          xcodebuild -version
          xcodebuild build-for-testing -project MedTracker.xcodeproj -scheme MedTracker \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0

      - name: Create and boot the simulators
        run: |
          xcrun simctl list devicetypes runtimes
          runtime="$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | .identifier')"
          echo "runtime: $runtime"
          pick() { for t in "$@"; do xcrun simctl list devicetypes | grep -qF "$t (" && { echo "$t"; return; }; done; }
          # The software keyboard, not the Mac's (Simulator.app's setting).
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          : > "$RUNNER_TEMP/devices"
          IFS=',' read -ra types <<< "${{ matrix.types }}"
          for t in "$(pick "${types[@]}")"; do
            [ -n "$t" ] || { echo "::error::no device type for ${{ matrix.width }}pt"; exit 1; }
            # The image's own device if it has one (a fresh device's first boot
            # migrates data for minutes), else a new one.
            udid="$(xcrun simctl list devices available -j | jq -r --arg rt "$runtime" --arg n "$t" '.devices[$rt][]? | select(.name == $n) | .udid' | head -n 1)"
            [ -n "$udid" ] || udid="$(xcrun simctl create "QA $t" "$t" "$runtime")"
            echo "${t// /-}=$udid" >> "$RUNNER_TEMP/devices"
          done
          while IFS='=' read -r dev udid; do
            start=$SECONDS
            xcrun simctl bootstatus "$udid" -b < /dev/null | tail -n 1
            echo "$dev booted in $((SECONDS - start))s"
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
            xcrun simctl ui "$udid" appearance dark
          done < "$RUNNER_TEMP/devices"
          cat "$RUNNER_TEMP/devices"

      - name: Run the scenes per device
        working-directory: ios
        run: |
          while IFS='=' read -r dev udid; do
            echo "::group::$dev"
            xcodebuild test-without-building -project MedTracker.xcodeproj -scheme MedTracker \
              -only-testing:MedTrackerUITests -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath build/sim -resultBundlePath "build/$dev.xcresult" < /dev/null \
              | grep -E ' error: |Added attachment|Test Case|Executed|\*\* TEST'
            [ "${PIPESTATUS[0]}" -eq 0 ] || echo "::warning::$dev: some scenes failed (see the errors above)"
            out="$GITHUB_WORKSPACE/shots/$dev"
            raw="$RUNNER_TEMP/raw-$dev"
            mkdir -p "$out"
            xcrun xcresulttool export attachments --path "build/$dev.xcresult" --output-path "$raw" || true
            # Exported as <uuid>.<ext>; the manifest maps each to its attachment
            # name plus an _<n>_<uuid> suffix. Only the scenes' <scene>.png /
            # <scene>.json are kept (not XCTest's own failure attachments).
            if [ -f "$raw/manifest.json" ]; then
              jq -r '.[].attachments[] | "\(.exportedFileName)\t\(.suggestedHumanReadableName)"' "$raw/manifest.json" |
                while IFS=$'\t' read -r file name; do
                  name="$(echo "$name" | sed -E 's/_[0-9]+_[0-9A-Fa-f-]{36}(\.[a-z]+)$/\1/')"
                  case "$name" in *.png|*.json) cp "$raw/$file" "$out/$name" ;; esac
                done
            fi
            ls -l "$out"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/devices"

      - name: Summary
        if: always()
        run: |
          scenes="$(jq -r '.scenes[].name' tests/visual/scenes.json)"
          broken=""
          {
            echo "## iOS visual QA"
            echo
            echo "Artifact \`ios-visual\`: \`<device>/<scene>.png\` plus the probe report \`<scene>.json\`, and \`compare/\` (diffs against master, in the visual-merge job). Evidence only, never a gate."
            while IFS='=' read -r dev udid; do
              d="shots/$dev"
              n="$(find "$d" -name '*.png' 2>/dev/null | wc -l | tr -d ' ')"
              [ "$n" -gt 0 ] || broken="$broken $dev"
              echo
              echo "### $dev ($n PNGs)"
              echo
              echo "| scene | png | probes |"
              echo "|---|---|---|"
              for s in $scenes; do
                png=missing; [ -f "$d/$s.png" ] && png=yes
                [ "$png" = yes ] || echo "::warning title=ios-visual $dev/$s::no screenshot" >&2
                if [ -f "$d/$s.json" ]; then
                  probe="$(jq -r '(if .ok then "ok" else ({failed, error} | tojson) end) + (if (.loads // 1) > 1 then " loads=\(.loads)" else "" end)' "$d/$s.json" 2>/dev/null || echo unreadable)"
                  jq -e '.ok' "$d/$s.json" >/dev/null 2>&1 || echo "::warning title=ios-visual $dev/$s::$probe" >&2
                elif [[ "$s" == native-* ]]; then probe="(native scene)"
                else probe="no report"; echo "::warning title=ios-visual $dev/$s::no probe report" >&2
                fi
                echo "| $s | $png | \`$probe\` |"
              done
            done < "$RUNNER_TEMP/devices"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$RUNNER_TEMP/devices" ] || [ -n "$broken" ]; then
            echo "::error::no screenshots from:${broken:- any device}"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-visual-${{ matrix.width }}
          path: shots/
          retention-days: 1
          if-no-files-found: warn

  # Joins the device jobs' shots into the one `ios-visual` artifact
  # (`<device>/<scene>.png|json` + `compare/`), and compares once.
  visual-merge:
    needs: visual
    # Also after a failed device job (the other's shots still count); not
    # when a newer run cancelled this one's devices.
    if: always() && (needs.visual.result == 'success' || needs.visual.result == 'failure')
    concurrency:
      group: ${{ github.workflow }}-visual-merge-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the compare step downloads master's ios-visual artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ios-visual-*
          path: shots/
          merge-multiple: true

      # bd med-y5xx.4: every shot against master's latest ios-visual artifact
      # (no goldens in git). Evidence only: never fails the job.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Compare with master
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/visual/compare.sh ios-visual shots shots/compare || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-visual
          path: shots/
          retention-days: 90
          if-no-files-found: warn

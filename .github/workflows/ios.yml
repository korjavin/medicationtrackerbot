name: iOS

# macOS minutes cost ~10x Linux and mobile CI was removed once for spend
# (med-2ue): this runs ONLY on ios/, this file, or the web app the build
# bundles for local mode (bd med-o7zq.4), or by hand. See docs/ios.md.
# deploy.yml ignores ios/** and this file, so iOS-only merges never redeploy.
# The `visual` job (Simulator screenshots, bd med-y5xx.3) is opt-in on top:
# PR label `ios-visual`, or a dispatch with visual=true. So is the `qa` job
# (flow QA on the Simulator, bd med-w6gx.23): PR label `ios-qa`, or qa=true.
# qa runs as seven restartable qa-part jobs (bd med-5yr8): account (offline
# account, account gone, ceremony exit), core (core local, FlowQATests,
# Health write-back), data (backup, stash) and rest (every other class,
# today Lock + Navigation), update (A/B banner), degraded (boot recovery),
# and eu (EU register), joined by the `qa` gate. Lists: env QA_PARTS.
on:
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'web/static/**'
      - 'web/cloud/**'
      - 'web/domain/**'
  pull_request:
    branches: [master]
    # labeled: adding `ios-visual` / `ios-qa` starts the visual / qa job (build skips that event).
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'web/static/**'
      - 'web/cloud/**'
      - 'web/domain/**'
      - 'tests/visual/**'
  # Any branch: spike branches ship to TestFlight from here.
  workflow_dispatch:
    inputs:
      health_diagnostic:
        description: Native HealthKit unsigned Simulator baseline only
        type: boolean
        default: false
      health_sign:
        description: Use Xcode Simulator signing for the HealthKit diagnostic
        type: boolean
        default: false
      visual:
        description: Simulator screenshots only (skips the build and TestFlight)
        type: boolean
        default: false
      visual_scenes:
        description: Optional comma-separated Simulator scenes (strict XCTest result)
        type: string
        default: ''
      qa:
        description: Simulator flow QA only (skips the build and TestFlight)
        type: boolean
        default: false
      qa_parts:
        description: Flow QA of only these comma-separated parts (account,core,data,update,degraded,eu,rest; implies qa, never the qa gate); empty with qa = all + the gate
        type: string
        default: ''

# The flow-QA parts' XCTest classes: the one list both the named parts'
# -only-testing and rest's -skip-testing come from (bd med-5yr8). A class in
# no list runs in rest; move it into a part when rest passes ~8 min of flows.
env:
  QA_PARTS: >-
    {"account": ["FlowQAOfflineAccountTests", "FlowQAAccountGoneTests", "FlowQACeremonyExitTests"],
     "core": ["FlowQACoreLocalTests", "FlowQATests", "HealthWriteBackTests"],
     "data": ["FlowQABackupTests", "FlowQAStashTests"],
     "update": ["FlowQAUpdateBannerTests"],
     "degraded": ["FlowQADegradedBootTests"],
     "eu": ["FlowQAEURegisterTests"]}
  # Fixed green references in seconds: core/data/update from 42923864088
  # (restore from attempt 2), degraded from 42921440898, and backup chain,
  # account/rest from 42915152895 attempt 1. Unknown tests remain n/a.
  QA_GREEN_SECONDS: >-
    {"testCoreLocal": 294, "testLocalFirstRun": 63,
     "testWriteReplaceFilterDelete": 110, "testDegradedBootReload": 211,
     "testAccountUpdateBanner": 211.2,
     "testBackupExport": 160, "testBackupExportRestoreChain": 297.423,
     "testErase": 98, "testRestoreFromFile": 145.574,
     "testLeaveStashPickup": 92, "testMoveLocalSide": 68,
     "testAccountGone": 66.470, "testWebExitBarLeaves": 183.059,
     "testOfflineColdOpen": 337.535, "testEURegister": 161.940, "testLocalLock": 180.954}

permissions:
  contents: read

jobs:
  health-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.health_diagnostic
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build native baseline
        env:
          HEALTH_SIGN: ${{ inputs.health_sign }}
        run: |
          set -o pipefail
          QA=1 ios/bundle-web.sh "${{ github.run_number }}"
          command -v xcodegen >/dev/null || brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild -version
          signing=NO
          [ "$HEALTH_SIGN" != true ] || signing=YES
          xcodebuild build-for-testing -project MedTracker.xcodeproj -scheme MedTracker \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED="$signing" CODE_SIGN_IDENTITY=- \
            WG_BASE_DOMAIN=qa.test > build.log 2>&1
      - name: Inspect built entitlements
        run: |
          app=ios/build/sim/Build/Products/Debug-iphonesimulator/MedTracker.app
          mkdir -p evidence
          codesign -dvvv --entitlements :- "$app" > evidence/signature.txt 2>&1 || true
          otool -l "$app/MedTracker" > evidence/load-commands.txt
          cp ios/App/MedTracker.entitlements evidence/requested-entitlements.plist
      - name: Boot Simulator
        run: ios/qa/boot-sim.sh 'iPhone 16e,iPhone 16,iPhone 15' '390pt'
      - name: Direct native authorization and query
        run: |
          set -o pipefail
          udid=$(cut -d= -f2 "$RUNNER_TEMP/devices")
          xcodebuild test-without-building -project ios/MedTracker.xcodeproj -scheme MedTracker \
            -only-testing:MedTrackerUITests/HealthDiagnosticTests -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath ios/build/sim -resultBundlePath evidence/health.xcresult \
            > evidence/xctest.log 2>&1
      - name: Collect native system logs
        if: always()
        run: |
          mkdir -p evidence
          if [ -f "$RUNNER_TEMP/devices" ]; then
            udid=$(cut -d= -f2 "$RUNNER_TEMP/devices")
            xcrun simctl spawn "$udid" log show --last 15m --style compact \
              --predicate 'process == "healthd" OR process == "MedTracker" OR subsystem CONTAINS "health"' \
              > evidence/health-system.log 2>&1 || true
          fi
          cp ios/build.log evidence/build.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-native-baseline
          path: evidence/
          retention-days: 3

  build:
    # Simulator flags AND modifier-only dispatches must never reach TestFlight.
    # A default dispatch still intentionally runs the distribution build.
    if: github.event.action != 'labeled' && !inputs.visual && !inputs.qa && !inputs.health_diagnostic && !inputs.health_sign && !inputs.visual_scenes && !inputs.qa_parts
    # Job-level, so a visual run never cancels a build or a TestFlight dispatch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Non-secret config lives in repo variables so the deployment domain and
      # Apple team stay out of this public tree; the build works without them.
      # Secrets are deliberately NOT job-level: only the dispatch-gated signing
      # steps below get them, so PR-controlled build steps never see them.
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      CLOUD_BASE_DOMAIN: ${{ vars.CLOUD_BASE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      # Before xcodegen: project.yml carries ios/LocalApp as a folder.
      - name: Bundle the web app for local mode
        run: ios/bundle-web.sh "${{ github.run_number }}"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Check first-run links, local document responses, the local lock, reminder paths, diagnostics, base.post and push wake
        working-directory: ios
        run: |
          swiftc -D DEBUG App/AccountURL.swift App/LocalOrigin.swift App/LocalApp.swift App/LocalLock.swift App/ReminderPath.swift App/Move.swift App/Diag.swift App/BasePost.swift App/Push.swift Tests/main.swift -o "$RUNNER_TEMP/accounturl-check"
          "$RUNNER_TEMP/accounturl-check"

      # build-for-testing: the app plus the MedTrackerUITests bundle (bd
      # med-y5xx.2), so the visual-QA target compiles on every iOS PR.
      - name: Build (unsigned, simulator)
        working-directory: ios
        run: |
          xcodebuild build-for-testing -project MedTracker.xcodeproj -scheme MedTracker \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/build.log" | tail -n 50
          status=${PIPESTATUS[0]}
          # The tail cuts the compiler's diagnostics off a failed build.
          grep -E ': error:' "$RUNNER_TEMP/build.log" | sort -u | head -n 40 || true
          test "$status" -eq 0

      # The archive step's "no QA hook" check greps for this marker; prove the
      # Debug build carries it, so that check cannot pass vacuously.
      - name: Check the Debug build carries the visual-QA hook
        working-directory: ios/build/sim/Build/Products/Debug-iphonesimulator/MedTracker.app
        run: |
          grep -qF 'wgapp://local/?qa=' MedTracker MedTracker.debug.dylib 2>/dev/null \
            || { echo "::error::QA hook marker not found in the Debug binary; update the archive check in this file"; exit 1; }

      # Local-mode diagnostic (bd med-o7zq.1): a broken page only shows on the
      # phone, so check the bundle carries it and its scripts parse.
      - name: Check local-mode diagnostic page
        working-directory: ios
        run: |
          test -f build/sim/Build/Products/Debug-iphonesimulator/MedTracker.app/LocalSpike/index.html
          node --check LocalSpike/js/boot.js
          find LocalSpike -name '*.js' ! -name boot.js -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f" || { echo "::error file=ios/$f::syntax error"; exit 1; }
          done

      # The local app's entry points are in the built bundle, and its
      # document loads the local entry, not cloud-boot.js.
      - name: Check local-mode bundle
        working-directory: ios/build/sim/Build/Products/Debug-iphonesimulator/MedTracker.app/LocalApp
        run: |
          for f in index.html cloud/js/apishim.js domain/bp.js static/js/core/utils.js static/vendor/dexie.min.js; do
            test -f "$f" || { echo "::error::LocalApp/$f missing from the app bundle"; exit 1; }
          done
          grep -q 'src="/js/local-boot.js"' index.html
          if grep -q 'cloud-boot.js' index.html; then echo "::error::local index.html loads cloud-boot.js"; exit 1; fi
          test ! -e static/js/tests && test ! -e cloud/js/tests
          # The entry itself comes from bd med-o7zq.2; until it lands local mode
          # (a test-build Settings toggle) boots to a broken page. Make this an error once it has landed.
          test -f cloud/js/local-boot.js || echo "::warning::LocalApp/cloud/js/local-boot.js missing (bd med-o7zq.2 not merged): local mode cannot boot"

      # TestFlight only on a manual dispatch, and only once every signing input
      # exists — until the owner adds them, the run stays green on the build above.
      - name: Check signing inputs
        id: signing
        if: github.event_name == 'workflow_dispatch'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for v in IOS_BUNDLE_ID IOS_TEAM_ID CLOUD_BASE_DOMAIN IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_APPSTORE_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight upload skipped — missing:$missing (see docs/ios.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install signing material
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "::add-mask::${CLOUD_BASE_DOMAIN}"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PW}"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
          # Manual signing with the owner's App Store profile: Xcode never
          # creates certificates or profiles (automatic signing minted an
          # Apple Development cert per ephemeral run, bd med-w6gx.12).
          PROFILE="$RUNNER_TEMP/appstore.mobileprovision"
          echo "$IOS_APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          # Native push (bd med-erq1.4): the profile's aps-environment, empty
          # while the App ID has no Push capability (owner bead med-erq1.7).
          APS="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)"
          echo "IOS_APS_ENV=$APS" >> "$GITHUB_ENV"
          # Xcode 16+ reads the first directory, older Xcode the second.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          rm "$PROFILE" "$RUNNER_TEMP/profile.plist"
          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Archive and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Native push (bd med-erq1.4): aps-environment only when the profile
          # carries it — signing an entitlement the profile lacks fails the
          # archive. Without it the app runs, push.token just answers null.
          if [ -n "$IOS_APS_ENV" ]; then
            /usr/libexec/PlistBuddy -c "Add :aps-environment string $IOS_APS_ENV" App/MedTracker.entitlements
            echo "aps-environment $IOS_APS_ENV"
          else
            echo "::notice::The App Store profile has no Push capability: built without aps-environment, push.token answers null (owner bead med-erq1.7)"
          fi
          # The archive gets no Apple account at all, so it cannot create a
          # certificate or profile; it signs with the imported identity only.
          xcodebuild archive -project MedTracker.xcodeproj -scheme MedTracker \
            -destination 'generic/platform=iOS' -archivePath build/MedTracker.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            WG_BASE_DOMAIN="${CLOUD_BASE_DOMAIN}" | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0
          # App Attest (bd med-o7zq.16): the signed app must carry it, or the
          # anonymous trial fails on device only.
          codesign -d --entitlements - --xml build/MedTracker.xcarchive/Products/Applications/MedTracker.app \
            | grep -q 'com.apple.developer.devicecheck.appattest-environment' \
            || { echo "::error::the signed app lacks the App Attest entitlement (App ID capability / profile)"; exit 1; }
          echo "App Attest entitlement present"
          # The visual-QA hook (bd med-y5xx.2) is #if DEBUG: the Release archive must not carry it.
          # Same marker the build job finds in the Debug binary.
          if grep -qF 'wgapp://local/?qa=' build/MedTracker.xcarchive/Products/Applications/MedTracker.app/MedTracker; then
            echo "::error::the archive carries the Debug-only -wgQAScene hook"; exit 1
          fi
          # The qa job builds with WG_BASE_DOMAIN=qa.test; the archive must carry the deployment's base.
          base="$(/usr/libexec/PlistBuddy -c 'Print :WGBaseDomain' build/MedTracker.xcarchive/Products/Applications/MedTracker.app/Info.plist)"
          [ "$base" = "$CLOUD_BASE_DOMAIN" ] || { echo "::error::the archive's WGBaseDomain is not CLOUD_BASE_DOMAIN"; exit 1; }
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $IOS_PROFILE_UUID" "$OPTS"
          # The API key is only for the upload: export is manual-signed
          # (ExportOptions.plist), so the account is never asked for signing assets.
          xcodebuild -exportArchive -archivePath build/MedTracker.xcarchive \
            -exportOptionsPlist "$OPTS" -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0

      - name: Clean up signing material
        if: always() && github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/asc_key.p8"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision" \
                "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"

  # Visual QA on the Simulator (bd med-y5xx.3, docs/design/ios-visual-testing.md):
  # every scene of tests/visual/scenes.json on a 390pt and a 440pt iPhone, as
  # the `ios-visual` artifact. Full runs report scene/probe failures as warnings;
  # explicit visual_scenes runs instead fail on any XCTest error.
  # One device per job (bd med-y5xx.12): booting both in one job is serial,
  # and overlapping boots starved the scenes; `visual-merge` joins them.
  visual:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.visual) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ios-visual') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ios-visual'))
    strategy:
      # One device's failure must not cancel the other's shots.
      fail-fast: false
      matrix:
        include:
          # First available type per width.
          - width: 390
            types: iPhone 16e,iPhone 16,iPhone 15
          - width: 440
            types: iPhone 17 Pro Max,iPhone 16 Pro Max
    # Per device: one shared group would make the two matrix jobs cancel each other.
    concurrency:
      group: ${{ github.workflow }}-visual-${{ github.ref }}-${{ matrix.width }}
      cancel-in-progress: true
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the web app with the QA driver
        run: QA=1 ios/bundle-web.sh "${{ github.run_number }}"

      - name: Generate Xcode project and build for testing
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          xcodebuild -version
          xcodebuild build-for-testing -project MedTracker.xcodeproj -scheme MedTracker \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            WG_BASE_DOMAIN=qa.test | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0

      - name: Create and boot the simulator
        run: ios/qa/boot-sim.sh "${{ matrix.types }}" "${{ matrix.width }}pt"

      - name: Run the scenes per device
        working-directory: ios
        env:
          TEST_RUNNER_WG_QA_SCENES: ${{ inputs.visual_scenes }}
        run: |
          while IFS='=' read -r dev udid; do
            echo "::group::$dev"
            xcodebuild test-without-building -project MedTracker.xcodeproj -scheme MedTracker \
              -only-testing:MedTrackerUITests/VisualQATests -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath build/sim -resultBundlePath "build/$dev.xcresult" < /dev/null \
              | grep -E ' error: |Added attachment|Test Case|Executed|\*\* TEST'
            test_status=${PIPESTATUS[0]}
            [ "$test_status" -eq 0 ] || echo "::warning::$dev: some scenes failed (see the errors above)"
            out="$GITHUB_WORKSPACE/shots/$dev"
            raw="$RUNNER_TEMP/raw-$dev"
            mkdir -p "$out"
            xcrun xcresulttool export attachments --path "build/$dev.xcresult" --output-path "$raw" || true
            # Exported as <uuid>.<ext>; the manifest maps each to its attachment
            # name plus an _<n>_<uuid> suffix. Only the scenes' <scene>.png /
            # <scene>.json are kept (not XCTest's own failure attachments).
            if [ -f "$raw/manifest.json" ]; then
              jq -r '.[].attachments[] | "\(.exportedFileName)\t\(.suggestedHumanReadableName)"' "$raw/manifest.json" |
                while IFS=$'\t' read -r file name; do
                  name="$(echo "$name" | sed -E 's/_[0-9]+_[0-9A-Fa-f-]{36}(\.[a-z]+)$/\1/')"
                  case "$name" in *.png|*.json) cp "$raw/$file" "$out/$name" ;; esac
                done
            fi
            ls -l "$out"
            echo "::endgroup::"
            if [ -n "$TEST_RUNNER_WG_QA_SCENES" ] && [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          done < "$RUNNER_TEMP/devices"

      - name: Summary
        if: always()
        run: |
          scenes="$(jq -r '.scenes[] | select(.flowOnly != true) | .name' tests/visual/scenes.json)"
          broken=""
          {
            echo "## iOS visual QA"
            echo
            echo "Artifact \`ios-visual\`: \`<device>/<scene>.png\` plus the probe report \`<scene>.json\`, and \`compare/\` (diffs against master, in the visual-merge job). Full runs are evidence-only; explicit \`visual_scenes\` runs fail on XCTest errors."
            while IFS='=' read -r dev udid; do
              d="shots/$dev"
              n="$(find "$d" -name '*.png' 2>/dev/null | wc -l | tr -d ' ')"
              [ "$n" -gt 0 ] || broken="$broken $dev"
              echo
              echo "### $dev ($n PNGs)"
              echo
              echo "| scene | png | probes |"
              echo "|---|---|---|"
              for s in $scenes; do
                png=missing; [ -f "$d/$s.png" ] && png=yes
                [ "$png" = yes ] || echo "::warning title=ios-visual $dev/$s::no screenshot" >&2
                if [ -f "$d/$s.json" ]; then
                  probe="$(jq -r '(if .ok then "ok" else ({failed, error} | tojson) end) + (if (.loads // 1) > 1 then " loads=\(.loads)" else "" end)' "$d/$s.json" 2>/dev/null || echo unreadable)"
                  jq -e '.ok' "$d/$s.json" >/dev/null 2>&1 || echo "::warning title=ios-visual $dev/$s::$probe" >&2
                elif [[ "$s" == native-* ]]; then probe="(native scene)"
                else probe="no report"; echo "::warning title=ios-visual $dev/$s::no probe report" >&2
                fi
                echo "| $s | $png | \`$probe\` |"
              done
            done < "$RUNNER_TEMP/devices"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$RUNNER_TEMP/devices" ] || [ -n "$broken" ]; then
            echo "::error::no screenshots from:${broken:- any device}"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-visual-${{ matrix.width }}
          path: shots/
          retention-days: 1
          if-no-files-found: warn

  # Flow QA on the Simulator (bd med-w6gx.23, docs/ios.md "Flow QA
  # (Simulator)"): the MedTrackerUITests flows, local mode, one 390pt device
  # per part. Unlike visual this is a gate: a failed flow fails the job.
  # Split into restartable parts (bd med-5yr8): qa-plan picks the parts,
  # qa-part runs one per runner, and the qa gate is the one result that
  # means "full flow QA green" (a qa_parts subset run skips it).
  qa-plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.qa || inputs.qa_parts != '')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'ios-qa') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ios-qa'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      # A job-level if cannot read matrix, so the dispatch's qa_parts picks
      # the matrix here. Unknown names fail instead of silently running less.
      - id: plan
        env:
          QA_PARTS_INPUT: ${{ inputs.qa_parts }}
        run: |
          all="$(jq -c 'keys_unsorted + ["rest"]' <<< "$QA_PARTS")"
          if [ -z "$QA_PARTS_INPUT" ]; then
            parts="$all"
          else
            parts="$(jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != "")) | unique' <<< "$QA_PARTS_INPUT")"
            bad="$(jq -r --argjson all "$all" '. - $all | join(",")' <<< "$parts")"
            [ -z "$bad" ] || { echo "::error::unknown qa_parts: $bad (known: $(jq -r 'join(",")' <<< "$all"))"; exit 1; }
            [ "$parts" != "[]" ] || { echo "::error::qa_parts names no part"; exit 1; }
          fi
          echo "parts=$parts" | tee -a "$GITHUB_OUTPUT"

  qa-part:
    name: qa-part (${{ matrix.part }})
    needs: qa-plan
    strategy:
      # One part's failure must not cancel the others: re-run only the red one.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.qa-plan.outputs.parts) }}
    # Per part: one shared group would make the parts cancel each other.
    concurrency:
      group: ${{ github.workflow }}-qa-${{ github.ref }}-${{ matrix.part }}
      cancel-in-progress: true
    runs-on: xcode-27
    # Green parts have run up to 29m39 on a slow runner (bd med-5yr8, Archie
    # 19273): a 30 min cap would cancel a part that was going to pass.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the web app with the QA driver
        env:
          QA_UPDATE_PROBE: ${{ matrix.part == 'update' && '1' || '0' }}
          QA_DEGRADED_PROBE: ${{ matrix.part == 'degraded' && '1' || '0' }}
          QA_EU_PROBE: ${{ matrix.part == 'eu' && '1' || '0' }}
        run: QA=1 ios/bundle-web.sh "${{ github.run_number }}"

      - name: Generate Xcode project and build for testing
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          xcodebuild -version
          # Ad-hoc signed, as the visual job: HealthKit needs its entitlement
          # (HealthWriteBackTests, bd med-8f4s.3).
          xcodebuild build-for-testing -project MedTracker.xcodeproj -scheme MedTracker \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            WG_BASE_DOMAIN=qa.test | tail -n 30
          test "${PIPESTATUS[0]}" -eq 0

      - name: Create and boot the simulator
        env:
          # Only core runs HealthWriteBackTests; the others skip the healthd wait.
          QA_HEALTH_READY: ${{ matrix.part == 'core' && '1' || '0' }}
        run: |
          ios/qa/boot-sim.sh "iPhone 16e,iPhone 16,iPhone 15" 390pt | tee "$RUNNER_TEMP/qa-boot.log"
          exit "${PIPESTATUS[0]}"

      # The account-gone flows' fake server (bd med-w6gx.23.5): tlsfront on
      # :443 for *.qa.test, the base the build above was given. This job's
      # build is never archived; the archive (build job) sets its own base.
      # Every part starts it (CoreLocal and FlowQATests assert zero receipts).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Start the fake account server (tlsfront) and trust its CA
        env:
          QA_BUNDLES: ${{ (matrix.part == 'update' || matrix.part == 'degraded') && '1' || '0' }}
        run: ios/qa/fake-server.sh

      - name: Run the flows
        working-directory: ios
        env:
          PART: ${{ matrix.part }}
        run: |
          IFS='=' read -r dev udid < "$RUNNER_TEMP/devices"
          # The part's classes from QA_PARTS (the one list). rest = the whole
          # bundle minus every named class, VisualQATests and
          # HealthDiagnosticTests: a class in no list runs here.
          if [ "$PART" = rest ]; then
            filter='"-only-testing:MedTrackerUITests", ([.[][], "VisualQATests", "HealthDiagnosticTests"][] | "-skip-testing:MedTrackerUITests/\(.)")'
          else
            filter='.[$p][] | "-only-testing:MedTrackerUITests/\(.)"'
          fi
          sel=()  # no mapfile: macOS's /bin/bash is 3.2
          while IFS= read -r f; do sel+=("$f"); done < <(jq -r --arg p "$PART" "$filter" <<< "$QA_PARTS")
          [ "${#sel[@]}" -gt 0 ] || { echo "::error::no classes for part $PART"; exit 1; }
          printf '%s\n' "${sel[@]}"
          # WebKit has no in-page heap API: the Simulator's WebContent RSS
          # (KB) each second, for the EU register numbers (bd med-3u28.4;
          # FlowQAEURegisterTests attaches the page's epoch-ms windows).
          # Named per part so the merged ios-qa keeps every part.
          mkdir -p "$GITHUB_WORKSPACE/shots"
          while :; do ps -axo pid=,rss=,command= | awk -v t="$(date +%s)" '/WebKit\.WebContent/ && !/awk/ {print t, $1, $2}'; sleep 1; done \
            > "$GITHUB_WORKSPACE/shots/webcontent-rss-$PART.log" 2>/dev/null &
          sampler=$!
          # The invites fake-server.sh minted, for FlowQACeremonyExitTests and
          # FlowQAOfflineAccountTests (TEST_RUNNER_ → the runner's env).
          TEST_RUNNER_WG_QA_CLAIM_URL="$QA_CLAIM_URL" TEST_RUNNER_WG_QA_OFFLINE_CLAIM_URL="$QA_OFFLINE_CLAIM_URL" TEST_RUNNER_WG_QA_UPDATE_CLAIM_URL="$QA_UPDATE_CLAIM_URL" xcodebuild test-without-building -project MedTracker.xcodeproj -scheme MedTracker \
            "${sel[@]}" -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build/sim -resultBundlePath build/qa.xcresult < /dev/null \
            | grep --line-buffered -E ' error: |Added attachment|Test Case|Executed|\*\* TEST'
          status="${PIPESTATUS[0]}"
          kill "$sampler" 2>/dev/null || true
          exit "$status"

      - name: Export screenshots and summary
        if: always()
        working-directory: ios
        env:
          PART: ${{ matrix.part }}
        run: |
          out="$GITHUB_WORKSPACE/shots"
          raw="$RUNNER_TEMP/raw"
          mkdir -p "$out"
          echo "## iOS flow QA: part $PART" >> "$GITHUB_STEP_SUMMARY"
          xcrun xcresulttool get test-results tests --path build/qa.xcresult > "$RUNNER_TEMP/qa-tests.json" || true
          python3 qa/runner-summary.py "$RUNNER_TEMP/qa-boot.log" "$RUNNER_TEMP/qa-tests.json" >> "$GITHUB_STEP_SUMMARY" || echo "Runner summary unavailable (helper failed)" >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/qa-tests.json" "$out/qa-tests-$PART.json"
          [ -d build/qa.xcresult ] || { echo "No result bundle" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          xcrun xcresulttool export attachments --path build/qa.xcresult --output-path "$raw" || true
          # Same manifest mapping as the visual job: <flow>-<step>.png, plus
          # a failed test's UI hierarchy (the first exported) as <Class>-<test>-hierarchy.txt
          # (bd med-w6gx.29: a flake left only screenshots to go on).
          if [ -f "$raw/manifest.json" ]; then
            jq -r '.[] | (.testIdentifier // "unknown" | gsub("[^A-Za-z0-9]+"; "-")) as $t | .attachments[] | "\(.exportedFileName)\t\(.suggestedHumanReadableName)\t\($t)"' "$raw/manifest.json" |
              while IFS=$'\t' read -r file name test; do
                name="$(echo "$name" | sed -E 's/_[0-9]+_[0-9A-Fa-f-]{36}(\.[a-z]+)$/\1/')"
                case "$name" in
                  *.png|*.json) cp "$raw/$file" "$out/$name" ;;
                  "App UI hierarchy"*) [ -e "$out/$test-hierarchy.txt" ] || cp "$raw/$file" "$out/$test-hierarchy.txt" ;;
                esac
              done
          fi
          ls -l "$out"
          {
            echo "Artifact \`ios-qa-$PART\` (merged into \`ios-qa\` by the qa gate on a full run): \`<flow>-<step>.png\`, \`webcontent-rss-$PART.log\`."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-qa-${{ matrix.part }}
          path: shots/
          retention-days: 14
          if-no-files-found: warn
          # No overwrite: a re-run's attempt adds its own ios-qa-<part> and the
          # failed attempt's evidence stays; the gate's download takes the
          # newest per name (download-artifact v4, latest).

  # The full flow-QA gate: green only when every part ran and passed; joins
  # the parts' shots into the one `ios-qa` artifact. A dispatch with
  # qa_parts never runs it (skipped, Archie 19127): "qa green on the exact
  # head" always means all parts. The explicit input check decides, not the
  # aggregated needs result.
  qa:
    needs: [qa-plan, qa-part]
    if: always() && needs.qa-plan.result != 'skipped' && inputs.qa_parts == ''
    concurrency:
      group: ${{ github.workflow }}-qa-gate-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-qa-*
          path: shots/
          merge-multiple: true

      - uses: actions/upload-artifact@v4
        with:
          name: ios-qa
          path: shots/
          retention-days: 14
          if-no-files-found: warn
          # The one merged ios-qa per run: a re-run of the gate replaces it, so
          # `gh run download -n ios-qa` always matches one (the newest parts).
          overwrite: true

      - name: Gate
        env:
          PLAN: ${{ needs.qa-plan.result }}
          PARTS: ${{ needs.qa-part.result }}
        run: |
          {
            echo "## iOS flow QA gate: all parts"
            echo
            echo "qa-plan: $PLAN, qa-part: $PARTS. Artifact \`ios-qa\`: every part's \`<flow>-<step>.png\` + \`webcontent-rss-<part>.log\`."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$PLAN" = success ] && [ "$PARTS" = success ] || { echo "::error::flow QA not green: qa-plan $PLAN, qa-part $PARTS (a part failed, was cancelled or skipped)"; exit 1; }

  # Joins the device jobs' shots into the one `ios-visual` artifact
  # (`<device>/<scene>.png|json` + `compare/`), and compares once.
  visual-merge:
    needs: visual
    # Also after a failed device job (the other's shots still count); not
    # when a newer run cancelled this one's devices.
    if: always() && (needs.visual.result == 'success' || needs.visual.result == 'failure')
    concurrency:
      group: ${{ github.workflow }}-visual-merge-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the compare step downloads master's ios-visual artifact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ios-visual-*
          path: shots/
          merge-multiple: true

      # bd med-y5xx.4: every shot against master's latest ios-visual artifact
      # (no goldens in git). Evidence only: never fails the job.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Compare with master
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/visual/compare.sh ios-visual shots shots/compare || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-visual
          path: shots/
          retention-days: 90
          if-no-files-found: warn

name: Deploy Application

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*_test.go'
      - '**/testdata/**'
      - 'web/static/js/tests/**'
      - 'python/tests/**'
      - 'python/**/test_*.py'
      - 'python/**/*_test.py'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'web/**'
      - 'python/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: medicationtrackerbot:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Git SHA and Timestamp
        run: |
          BUILD_TS="$(date +%Y%m%d-%H%M)"
          sed -i "s|VERSION_PLACEHOLDER|$(git rev-parse --short HEAD)|g" web/static/index.html web/static/wg-primitives.html
          sed -i "s|TIMESTAMP_PLACEHOLDER|${BUILD_TS}|g" web/static/index.html web/static/wg-primitives.html
          sed -i "s|CACHE_VERSION_PLACEHOLDER|v${BUILD_TS}|g" web/static/sw.js

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update and commit docker-compose.yml
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -B deploy

          # Update image tags in docker-compose.yml
          # Replaces :latest (or any tag) with :<sha>
          # Using environment variables prevents template injection attacks
          
          IMAGE_NAME="ghcr.io/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}"
          
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${GITHUB_COMMIT_SHA}|g" docker-compose.yml

          git add docker-compose.yml
          git commit -m "ci: Update image tag to ${GITHUB_COMMIT_SHA}" || echo "No changes to commit"
          git push origin deploy --force

      - name: Trigger Portainer Redeploy Webhooks
        env:
          HOOKS: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
        run: |
          pids=()
          idx=0
          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            idx=$((idx+1))
            echo "Triggering hook #${idx}..."
            curl -s -w "\n[HTTP %{http_code}]\n" -X POST "$url" &
            pids+=($!)
          done <<< "$HOOKS"
          echo "Total hooks triggered: ${#pids[@]}"
          for pid in "${pids[@]}"; do
            wait "$pid" || echo "Hook PID $pid exited with error"
          done

name: Deploy Application

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*_test.go'
      - '**/testdata/**'
      - 'web/static/js/tests/**'
      - 'python/tests/**'
      - 'python/**/test_*.py'
      - 'python/**/*_test.py'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'web/**'
      - 'python/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            tags: ''
    name: test (${{ matrix.name }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            go build -tags "${{ matrix.tags }}" ./...
          else
            go build ./...
          fi

      - name: Run tests
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            go test -tags "${{ matrix.tags }}" -count=1 ./...
          else
            go test -count=1 ./...
          fi

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: medicationtrackerbot:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write
      # Release-integrity evidence (bd med-yor.8, docs/security/release-integrity.md):
      # keyless Sigstore signing of the image's SLSA provenance. The cloud origin
      # serves the JavaScript that handles the vault DEK, so "which build is this
      # origin running, and did this repo's CI actually build it" has to be
      # answerable by someone other than the operator.
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Git SHA and Timestamp
        run: |
          BUILD_TS="$(date +%Y%m%d-%H%M)"
          sed -i "s|VERSION_PLACEHOLDER|$(git rev-parse --short HEAD)|g" web/static/index.html web/static/wg-primitives.html
          sed -i "s|TIMESTAMP_PLACEHOLDER|${BUILD_TS}|g" web/static/index.html web/static/wg-primitives.html
          sed -i "s|CACHE_VERSION_PLACEHOLDER|v${BUILD_TS}|g" web/static/sw.js web/cloud/sw.js

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signs a SLSA provenance statement for the pushed image with a short-lived
      # Sigstore certificate bound to this workflow's OIDC identity — no key
      # material to hold, nothing to rotate. Anyone can then check that the image
      # a cloud host is running came from this repository at this commit:
      #   gh attestation verify oci://ghcr.io/<owner>/<repo>:<sha> --repo <owner>/<repo>
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      # Published hashes of every browser-delivered file, taken from the same
      # tree the image was built from (the placeholder sed above has already
      # run, so these are the bytes the origin serves). This is the convenience
      # view of the attested image: it turns "is my browser running the public
      # build?" into a curl + sha256sum per asset instead of pulling and
      # unpacking the image. See docs/security/release-integrity.md.
      - name: Publish browser-bundle hashes
        run: |
          find web -type f \( -name '*.js' -o -name '*.html' -o -name '*.css' -o -name '*.json' \) \
            -not -path 'web/*/js/tests/*' -not -path 'web/*/tests/*' \
            | LC_ALL=C sort | xargs sha256sum > /tmp/SHA256SUMS-web.txt
          {
            echo "### Browser bundle — $(wc -l < /tmp/SHA256SUMS-web.txt) files"
            echo "commit \`${{ github.sha }}\`, image digest \`${{ steps.build-and-push.outputs.digest }}\`"
            echo '<details><summary>SHA256SUMS</summary>'
            echo
            echo '```'
            cat /tmp/SHA256SUMS-web.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser-bundle hashes
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle-sha256sums-${{ github.sha }}
          path: /tmp/SHA256SUMS-web.txt

      - name: Update and commit docker-compose.yml
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -B deploy

          # Update image tags in docker-compose.yml
          # Replaces :latest (or any tag) with :<sha>
          # Using environment variables prevents template injection attacks
          
          IMAGE_NAME="ghcr.io/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}"

          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${GITHUB_COMMIT_SHA}|g" docker-compose.yml docker-compose.cloud.yml

          git add docker-compose.yml docker-compose.cloud.yml
          git commit -m "ci: Update image tag to ${GITHUB_COMMIT_SHA}" || echo "No changes to commit"
          git push origin deploy --force

      - name: Trigger Portainer Redeploy Webhooks
        env:
          HOOKS: ${{ secrets.PORTAINER_REDEPLOY_HOOK }}
        run: |
          pids=()
          idx=0
          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            idx=$((idx+1))
            echo "Triggering hook #${idx}..."
            curl -s -w "\n[HTTP %{http_code}]\n" -X POST "$url" &
            pids+=($!)
          done <<< "$HOOKS"
          echo "Total hooks triggered: ${#pids[@]}"
          for pid in "${pids[@]}"; do
            wait "$pid" || echo "Hook PID $pid exited with error"
          done

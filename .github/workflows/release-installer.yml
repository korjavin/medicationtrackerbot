name: Release Installer

on:
  push:
    tags:
      - "installer-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # This ensures all tags are fetched

      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/installer/go.mod
          cache-dependency-path: cmd/installer/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: cmd/installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ replace(github.ref_name, 'installer-', '') }}

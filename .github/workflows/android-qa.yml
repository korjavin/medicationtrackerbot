name: Android QA

# Agent QA harness (bd med-nt9p.23, docs/android.md → Agent QA harness): boots an
# emulator, installs a QA debug APK and drives native-screen scenarios, uploading
# screenshots + logcat + the shell's diag log. Discovery evidence only, never
# sign-off. Manual dispatch only; separate from android.yml's build/release path.
# Needs ZERO secrets: the APK's base is the public placeholder qa.test and the
# package is the committed placeholder, so nothing here touches real accounts.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario (android/qa/scenarios/<name>.mjs), or all of them"
        type: choice
        options: [all, firstrun, native-dark, native-lock, native-fontscale, back-exit, claim-page, not-found, external-link, authn-probe, smoke, local-smoke, local-visual, local-spike, local-app, local-backup, local-to-cloud, local-to-cloud-seamless, move-ops, delete-account]
        default: all
      font_scale:
        description: "System font scale applied before each scenario"
        type: choice
        options: ['1.0', '1.3', '2.0']
        default: '1.0'
      dark:
        description: "System dark mode"
        type: boolean
        default: false
      landscape:
        description: "Rotate to landscape"
        type: boolean
        default: false
      api_level:
        description: "Emulator API level (34 = minSdk)"
        type: string
        default: '34'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # local-visual's compare downloads master's android-visual artifact

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # local-visual: ~20 cold starts
    env:
      CLOUD_BASE_DOMAIN: qa.test # public placeholder, NOT the deployment's base
      QA_PKG: com.example.medtracker # ANDROID_PACKAGE stays unset → build.gradle.kts placeholder
      QA_FONT_SCALE: ${{ inputs.font_scale }}
      QA_DARK: ${{ inputs.dark }}
      QA_LANDSCAPE: ${{ inputs.landscape }}
      # local-visual's artifact (bd med-y5xx.9): android-visual, suffixed by each non-default input.
      VISUAL_ARTIFACT: android-visual${{ inputs.api_level != '34' && format('-api{0}', inputs.api_level) || '' }}${{ inputs.font_scale != '1.0' && format('-font{0}', inputs.font_scale) || '' }}${{ inputs.dark && '-dark' || '' }}${{ inputs.landscape && '-landscape' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.11.1'

      # Local mode's bundle, as android.yml makes it, plus the visual QA driver at /qa/ (QA=1,
      # bd med-nt9p.32.6): both APKs below carry it; neither ever ships.
      - name: Bundle the web app for local mode (QA=1)
        env:
          WG_BUNDLE_OUT: android/app/src/main/assets/web
          WG_BUNDLE_PREFIX: android-qa # distinct from android.yml's line: this bundle never ships
          QA: '1'
        run: ios/bundle-web.sh "${{ github.run_number }}"

      - name: Build QA debug APK (+ release, to prove it has no QA hooks)
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      # bd med-nt9p.25: the soft authenticator is debug-source-set only. The unsigned release
      # APK is built from the same tree as the AAB / publish_apk_release APK.
      - name: Release APK carries no QA soft authenticator
        working-directory: android/app/build/outputs/apk
        run: |
          unzip -l debug/app-debug.apk | grep -q 'assets/qa-softauthn.js' || { echo 'debug APK lacks the asset'; exit 1; }
          rel=$(ls release/*.apk | head -1)
          assets=$(unzip -l "$rel" | grep -c 'qa-softauthn' || true)
          dex=$(unzip -p "$rel" 'classes*.dex' | grep -ac 'qaSoftAuthn\|qa-softauthn\|wgQAScene\|wgQALock' || true)
          echo "release $rel: qa-softauthn entries=$assets, dex mentions=$dex"
          { echo "### Release APK QA-hook check"; echo; echo "\`$(basename "$rel")\`: qa-softauthn files **$assets**, dex mentions of qaSoftAuthn/qa-softauthn/wgQAScene/wgQALock **$dex** (both must be 0)"; echo; } >> "$GITHUB_STEP_SUMMARY"
          [ "$assets" = 0 ] && [ "$dex" = 0 ]

      # The local cloud the emulator reaches (bd med-nt9p.24, docs/android.md → Agent QA harness):
      # cmd/cloud on :8080 ← tlsfront on :443 (throwaway CA) ← emulator via 10.0.2.2.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Start the local cloud + TLS front, mint a test invite
        run: |
          go build -o "$RUNNER_TEMP/cloud" ./cmd/cloud
          go build -o "$RUNNER_TEMP/tlsfront" ./android/qa/tlsfront
          export SESSION_SECRET="$(openssl rand -base64 48)" CLOUD_DB_PATH="$RUNNER_TEMP/cloud.db" PORT=8080
          nohup "$RUNNER_TEMP/cloud" > "$RUNNER_TEMP/cloud.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          inv="$("$RUNNER_TEMP/cloud" admin invite)"
          claim="$(grep -oE 'https://[^[:space:]]+#claim=[a-f0-9]+' <<<"$inv" | head -1)"
          host="${claim#https://}"; host="${host%%/*}"
          [ -n "$claim" ] || { echo "no claim URL in: $inv"; exit 1; }
          sudo -b nohup "$RUNNER_TEMP/tlsfront" -ca "$RUNNER_TEMP/ca.pem" "$host" > "$RUNNER_TEMP/tlsfront.log" 2>&1
          for i in $(seq 1 30); do [ -s "$RUNNER_TEMP/ca.pem" ] && break; sleep 1; done
          curl -sS --fail -o /dev/null --cacert "$RUNNER_TEMP/ca.pem" --resolve "$host:443:127.0.0.1" "https://$host/unlock"
          echo "QA_CLAIM_URL=$claim" >> "$GITHUB_ENV"
          echo "QA_CA=$RUNNER_TEMP/ca.pem" >> "$GITHUB_ENV"

      - name: Install Playwright + its Android driver APKs (no browsers)
        working-directory: android/qa
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npx playwright install android

      # KVM for the x86_64 emulator, per the android-emulator-runner README.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The script fails on a scenario failure only after it has collected
      # logcat + diag.xml; the upload below runs regardless.
      - name: Run scenario on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back ${{ inputs.scenario == 'local-spike' && 'emulated' || 'none' }}
          script: bash android/qa/run.sh android/app/build/outputs/apk/debug/app-debug.apk ${{ inputs.scenario || 'all' }} qa-out

      - name: Collect server logs
        if: always()
        run: mkdir -p qa-out && cp "$RUNNER_TEMP/cloud.log" "$RUNNER_TEMP/tlsfront.log" qa-out/ || true

      # Visual QA tier (bd med-y5xx.9, docs/design/ios-visual-testing.md Phase 3): local-visual's
      # visual/<scene>.png|json against master's latest dispatch with the same artifact name, as
      # the iOS tiers do. The name carries every non-default input, so a dark or 1.3x run only
      # ever compares with its own kind. Evidence only: never fails the job.
      - name: Set up pnpm (visual compare)
        if: always() && inputs.scenario == 'local-visual'
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.10.0
          run_install: false

      - name: Compare with master (visual)
        if: always() && inputs.scenario == 'local-visual'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/visual/compare.sh "$VISUAL_ARTIFACT" qa-out/visual qa-out/visual/compare || true

      - name: Upload visual artifact
        if: always() && inputs.scenario == 'local-visual'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.VISUAL_ARTIFACT }}
          path: qa-out/visual/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-qa-${{ inputs.scenario || 'all' }}
          path: qa-out/
          if-no-files-found: warn
          retention-days: 14

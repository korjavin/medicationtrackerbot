name: Android QA

# Agent QA harness (bd med-nt9p.23, docs/android.md → Agent QA harness): boots an
# emulator, installs a QA debug APK and drives native-screen scenarios, uploading
# screenshots + logcat + the shell's diag log. Discovery evidence only, never
# sign-off. Manual dispatch only; separate from android.yml's build/release path.
# Needs ZERO secrets: the APK's base is the public placeholder qa.test and the
# package is the committed placeholder, so nothing here touches real accounts.
on:

  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario (android/qa/scenarios/<name>.mjs), or all of them"
        type: choice
        options: [all, firstrun, native-dark, native-fontscale, back-exit]
        default: all
      font_scale:
        description: "System font scale applied before each scenario"
        type: choice
        options: ['1.0', '1.3', '2.0']
        default: '1.0'
      dark:
        description: "System dark mode"
        type: boolean
        default: false
      landscape:
        description: "Rotate to landscape"
        type: boolean
        default: false
      api_level:
        description: "Emulator API level (34 = minSdk)"
        type: string
        default: '34'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUD_BASE_DOMAIN: qa.test # public placeholder, NOT the deployment's base
      QA_PKG: com.example.medtracker # ANDROID_PACKAGE stays unset → build.gradle.kts placeholder
      QA_FONT_SCALE: ${{ inputs.font_scale }}
      QA_DARK: ${{ inputs.dark }}
      QA_LANDSCAPE: ${{ inputs.landscape }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.11.1'

      - name: Build QA debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Install Playwright + its Android driver APKs (no browsers)
        working-directory: android/qa
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npx playwright install android

      # KVM for the x86_64 emulator, per the android-emulator-runner README.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The script fails on a scenario failure only after it has collected
      # logcat + diag.xml; the upload below runs regardless.
      - name: Run scenario on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/qa/run.sh android/app/build/outputs/apk/debug/app-debug.apk ${{ inputs.scenario || 'all' }} qa-out

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-qa-${{ inputs.scenario || 'all' }}
          path: qa-out/
          if-no-files-found: warn
          retention-days: 14

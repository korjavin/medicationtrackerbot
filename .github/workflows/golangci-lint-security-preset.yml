name: golangci-lint Security Preset

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint with security preset
        id: golangci
        run: |
          golangci-lint run --config .golangci.yml ./... || EXIT_CODE=$?
          if [ ! -f golangci-lint-result.sarif ]; then
            echo "SARIF file not generated, creating empty one"
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"golangci-lint","version":"latest","informationUri":"https://golangci-lint.run"}},"results":[]}]}' > golangci-lint-result.sarif
          fi
          exit ${EXIT_CODE:-0}

      - name: Upload golangci-lint SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: golangci-lint-result.sarif
          category: golangci-lint
        if: always()
        continue-on-error: true

      - name: Display golangci-lint results summary
        if: always()
        run: |
          echo "golangci-lint security preset check completed"
          echo "Configuration: .golangci.yml"
          echo "Linters enabled: gosec, errorlint, and more"
